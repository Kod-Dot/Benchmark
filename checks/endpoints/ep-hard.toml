[[check]]
id = "EP-HARD-046"
title = "Kiosk/shared machine autologon with stored password (Winlogon DefaultPassword)"
status = "implemented"
severity = "high"

[check.detail]
description = "Automatic sign-in is configured (AutoAdminLogon 1 under HKLM\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Winlogon) and a DefaultPassword value exists in the same key. The assessment only checks that the value exists and never reads the password."
impact = "The sign-in account's password is stored in clear text in the registry, where local users and administrators can read it. If the account is a domain account, the password can be used on any other machine where the account can sign in."
attack = [
  "Signs in to the machine, or reaches its registry remotely.",
  "Reads DefaultUserName, DefaultDomainName and DefaultPassword from the Winlogon key.",
  "Signs in with the recovered account elsewhere in the domain.",
]
remediation = [
  "Delete the DefaultPassword value and set AutoAdminLogon to 0, unless the machine is a kiosk that needs automatic sign-in.",
  "For kiosks, use Assigned Access with a local or auto-generated account, or Sysinternals Autologon, which stores the password as an LSA secret instead of in the registry.",
  "Change the password of the account that was stored, and make sure it has no rights beyond the kiosk.",
]
frameworks = [
  "CIS Microsoft Windows 11 Enterprise Benchmark",
  "NIST 800-53 IA-5",
]
verify = '''
$k = Get-Item 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
[pscustomobject]@{ AutoAdminLogon = $k.GetValue('AutoAdminLogon'); DefaultUserName = $k.GetValue('DefaultUserName'); DefaultPasswordStored = $k.GetValueNames() -contains 'DefaultPassword' }'''
cvss = "AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N"
mitre = ["T1552", "T1078.002"]

