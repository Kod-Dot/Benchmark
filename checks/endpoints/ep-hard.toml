[[check]]
id = "EP-HARD-041"
title = "Audit policy and event log sizes"
status = "implemented"
severity = "medium"

[check.detail]
description = "The machine does not audit at least one of these subcategories: Logon, Special Logon, Process Creation, User Account Management, Security Group Management, Credential Validation; or its Security event log is smaller than 192 MB."
impact = "Sign-ins, privileged logons, new processes and account changes on the machine are not recorded or are overwritten quickly, so attacks cannot be detected or investigated afterwards."
remediation = [
  "Enable the subcategories under Computer Configuration > Windows Settings > Security Settings > Advanced Audit Policy Configuration > Audit Policies (Logon/Logoff, Detailed Tracking, Account Management, Account Logon).",
  "Set Computer Configuration > Windows Settings > Security Settings > Local Policies > Security Options > Audit: Force audit policy subcategory settings to override audit policy category settings = Enabled.",
  "Set Computer Configuration > Administrative Templates > Windows Components > Event Log Service > Security > Specify the maximum log file size (KB) to 196608 or more.",
  "Forward the Security log to a SIEM.",
]
frameworks = [
  "CIS Microsoft Windows 11 Enterprise Benchmark",
  "CIS Microsoft Windows Server Benchmark",
  "Microsoft security baseline",
  "NIST 800-53 AU-2",
]
verify = '''
auditpol /get /category:*
Get-WinEvent -ListLog Security | Select-Object LogName, MaximumSizeInBytes'''

