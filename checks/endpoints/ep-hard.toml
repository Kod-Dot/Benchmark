[[check]]
id = "EP-HARD-042"
title = "Sysmon / EDR agent present and healthy"
status = "implemented"
severity = "medium"

[check.detail]
description = "No known EDR agent service (such as Microsoft Defender for Endpoint, CrowdStrike Falcon or SentinelOne) and no Sysmon service is running on the machine."
impact = "Activity on the machine, such as process starts, network connections and credential access, is not recorded in enough detail to detect or investigate an attack."
remediation = [
  "Onboard the machine to the organization's EDR product, for example Microsoft Defender for Endpoint through Intune or the Group Policy onboarding package.",
  "Where no EDR is available, install Sysmon with a maintained configuration and forward its events to a SIEM.",
  "Check that the agent reports in from the EDR console after onboarding.",
]
frameworks = [
  "NIST 800-53 SI-4",
  "CIS Controls v8",
]
verify = '''
Get-Service | Where-Object { $_.Name -match '^(Sense|Sysmon|Sysmon64|CSFalconService|SentinelAgent|CylanceSvc|xagt|CbDefense|cyserver|elastic-endpoint)$' } |
  Select-Object Name, Status, StartType'''

