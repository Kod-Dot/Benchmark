url = "https://attack.mitre.org/techniques/T1068/"

[[check]]
id = "EP-HARD-034"
title = "AlwaysInstallElevated enabled"
status = "implemented"
severity = "high"

[check.detail]
description = "AlwaysInstallElevated is set to 1 for the machine under HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\Installer."
impact = "When the same value is also set for the user (by policy or by the user under HKCU), Windows Installer runs any MSI package the user starts with SYSTEM rights. Any user can then gain full control of the machine."
attack = [
  "Signs in to the machine as an ordinary user.",
  "Sets or finds AlwaysInstallElevated under HKCU\\SOFTWARE\\Policies\\Microsoft\\Windows\\Installer.",
  "Runs a crafted MSI package that adds the user to the local Administrators group.",
]
remediation = [
  "Set Computer Configuration > Administrative Templates > Windows Components > Windows Installer > Always install with elevated privileges = Disabled.",
  "Set User Configuration > Administrative Templates > Windows Components > Windows Installer > Always install with elevated privileges = Disabled.",
  "Deploy software with Intune, Configuration Manager or Group Policy software installation instead.",
]
frameworks = [
  "CIS Microsoft Windows 11 Enterprise Benchmark",
  "CIS Microsoft Windows Server Benchmark",
  "Microsoft security baseline",
]
verify = '''
reg query HKLM\SOFTWARE\Policies\Microsoft\Windows\Installer /v AlwaysInstallElevated'''
cvss = "AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H"
mitre = ["T1068"]

[[check.detail.references]]
title = "AlwaysInstallElevated"
url = "https://learn.microsoft.com/windows/win32/msi/alwaysinstallelevated"

[[check]]
id = "EP-HARD-035"
title = "UAC settings (admin approval mode, remote UAC token filtering LocalAccountTokenFilterPolicy)"
status = "implemented"
severity = "medium"

[check.detail]
description = "User Account Control is weakened on the machine: UAC is off (EnableLUA 0), administrators are elevated without a prompt (ConsentPromptBehaviorAdmin 0), or remote UAC token filtering is off for local accounts (LocalAccountTokenFilterPolicy 1)."
impact = "Code that a local administrator runs gets full rights without any prompt. With LocalAccountTokenFilterPolicy 1, any local administrator account, such as a shared built-in Administrator, can be used remotely with full rights, which allows pass-the-hash with local accounts."
attack = [
  "Gets the password or hash of a local administrator account from one machine.",
  "Authenticates remotely to this machine with that local account, which gets a full administrator token.",
  "Runs commands with full rights over SMB or WinRM.",
]
remediation = [
  "Under Computer Configuration > Windows Settings > Security Settings > Local Policies > Security Options, set User Account Control: Run all administrators in Admin Approval Mode = Enabled.",
  "Set User Account Control: Behavior of the elevation prompt for administrators in Admin Approval Mode = Prompt for consent on the secure desktop.",
  "Set Computer Configuration > Administrative Templates > MS Security Guide > Apply UAC restrictions to local accounts on network logons = Enabled (LocalAccountTokenFilterPolicy 0).",
]
frameworks = [
  "CIS Microsoft Windows 11 Enterprise Benchmark",
  "CIS Microsoft Windows Server Benchmark",
  "Microsoft security baseline",
]
verify = '''
Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' |
  Select-Object EnableLUA, ConsentPromptBehaviorAdmin, LocalAccountTokenFilterPolicy, FilterAdministratorToken'''
cvss = "AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H"
mitre = ["T1078.003", "T1550"]

[[check.detail.references]]
title = "MITRE ATT&CK T1550: Use Alternate Authentication Material"
url = "https://attack.mitre.org/techniques/T1550/"

[[check]]
id = "EP-HARD-036"
title = "Stored credentials (Credential Manager entries for domain accounts, count only)"
status = "implemented"
severity = "low"

[check.detail]
description = "Member servers hold saved Credential Manager entries (the number of credential files in user profiles; their content is never read)."
impact = "Saved credentials can be decrypted by anyone with admin rights on the server, giving the passwords of other accounts and systems."
remediation = [
  "Remove saved credentials from servers and turn on \"Network access: Do not allow storage of passwords and credentials for network authentication\".",
]
verify = "cmdkey /list  # per user"
mitre = ["T1552"]

[[check]]
id = "EP-HARD-037"
title = "Privileged domain accounts with sessions on the machine (Tier violation, feeds attack graph)"
status = "implemented"
severity = "high"

[check.detail]
description = "A privileged domain account, a member of an AD admin group, has an interactive or Remote Desktop session on a member server or workstation."
impact = "The account's credentials are in memory on a machine with a lower security level than the domain. Anyone who gains local administrator rights on the machine can take them and take over the domain."
attack = [
  "Gains local administrator rights on a member machine.",
  "Finds a signed-in domain admin session on it.",
  "Dumps LSASS or impersonates the session's token and acts as the domain admin.",
]
remediation = [
  "Sign out the listed sessions and change the passwords of the accounts if the machine may be compromised.",
  "Deny Tier 0 accounts sign-in on member machines with Group Policy: Computer Configuration > Windows Settings > Security Settings > Local Policies > User Rights Assignment > Deny log on locally and Deny log on through Remote Desktop Services.",
  "Add privileged accounts to the Protected Users group and give admins separate accounts and privileged access workstations for each tier.",
]
frameworks = [
  "Microsoft enterprise access model",
  "NIST 800-53 AC-6",
]
verify = '''
quser'''
cvss = "AV:L/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:H"
mitre = ["T1003.001", "T1078.002", "T1550"]

