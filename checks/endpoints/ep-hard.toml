url = "https://attack.mitre.org/techniques/T1003/001/"

[[check]]
id = "EP-HARD-038"
title = "Shares with Everyone/Authenticated Users write access"
status = "implemented"
severity = "high"

[check.detail]
description = "An SMB share on the machine grants Change or Full share permission to Everyone, Authenticated Users, Users or Domain Users."
impact = "Unless NTFS permissions restrict it, any domain user can change or delete files on the share. Attackers use such shares to plant malicious programs, shortcuts or scripts that other users or services run, and to stage ransomware."
attack = [
  "Lists shares across the network with any domain account.",
  "Finds a share where it can write and plants a malicious file, script or shortcut.",
  "Waits for users or scheduled jobs that use the share to run it.",
]
remediation = [
  "Replace the broad group with the groups that need write access, in the share permissions and in the NTFS permissions of the folder.",
  "Use Get-SmbShareAccess to review, and Revoke-SmbShareAccess or the share's Properties dialog to remove the access.",
  "Remove shares that are no longer used.",
]
frameworks = [
  "NIST 800-53 AC-3",
  "NIST 800-53 AC-6",
]
verify = '''
Get-SmbShare | Get-SmbShareAccess | Where-Object { $_.AccessControlType -eq 'Allow' -and $_.AccessRight -in 'Change', 'Full' } |
  Select-Object Name, AccountName, AccessRight'''
cvss = "AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:L"

[[check]]
id = "EP-HARD-039"
title = "NTLM settings (LmCompatibilityLevel, outgoing NTLM restrictions)"
status = "implemented"
severity = "medium"

[check.detail]
description = "LmCompatibilityLevel under HKLM\\SYSTEM\\CurrentControlSet\\Control\\Lsa is not 5 (send NTLMv2 response only, refuse LM and NTLM). The outgoing NTLM restriction (RestrictSendingNTLMTraffic) is shown as evidence."
impact = "The machine may send or accept LM and NTLMv1 responses. These can be captured and cracked quickly, or turned into the account's NTLM hash, which can then be used to authenticate."
attack = [
  "Makes the machine or a user authenticate to an attacker host, by poisoning or coercion.",
  "Requests a downgraded LM or NTLMv1 response.",
  "Cracks the response or recovers the NTLM hash and uses it to authenticate as the account.",
]
remediation = [
  "Set Computer Configuration > Windows Settings > Security Settings > Local Policies > Security Options > Network security: LAN Manager authentication level = Send NTLMv2 response only. Refuse LM & NTLM.",
  "Audit NTLM use first with Network security: Restrict NTLM: Audit Incoming NTLM Traffic and fix applications that still need NTLMv1.",
  "Consider Network security: Restrict NTLM: Outgoing NTLM traffic to remote servers once NTLM use is known.",
]
frameworks = [
  "CIS Microsoft Windows 11 Enterprise Benchmark",
  "CIS Microsoft Windows Server Benchmark",
  "Microsoft security baseline",
]
verify = '''
reg query HKLM\SYSTEM\CurrentControlSet\Control\Lsa /v LmCompatibilityLevel
reg query HKLM\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0 /v RestrictSendingNTLMTraffic'''
cvss = "AV:A/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N"
mitre = ["T1557.001", "T1550"]

