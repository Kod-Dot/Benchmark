url = "https://learn.microsoft.com/previous-versions/windows/it-pro/windows-10/security/threat-protection/security-policy-settings/network-security-lan-manager-authentication-level"

[[check]]
id = "EP-HARD-040"
title = "TLS 1.0/1.1 and weak ciphers enabled"
status = "implemented"
severity = "low"

[check.detail]
description = "TLS 1.0 or TLS 1.1 is not explicitly disabled for the server side in Schannel: Enabled is not 0 under HKLM\\SYSTEM\\CurrentControlSet\\Control\\SecurityProviders\\SCHANNEL\\Protocols\\TLS 1.0\\Server or TLS 1.1\\Server."
impact = "Services on the machine that use Schannel, such as IIS, RDP or LDAPS, may accept connections over old TLS versions with known weaknesses, which makes interception and downgrade attacks easier."
attack = [
  "Gets a position on the network path to the machine.",
  "Forces or waits for a client to connect over TLS 1.0 or 1.1.",
  "Uses known protocol weaknesses to attack the session.",
]
remediation = [
  "Create the keys HKLM\\SYSTEM\\CurrentControlSet\\Control\\SecurityProviders\\SCHANNEL\\Protocols\\TLS 1.0\\Server and TLS 1.1\\Server with Enabled = 0 and DisabledByDefault = 1, using a Group Policy registry preference or Intune, then restart.",
  "Test applications that may still need old TLS versions first.",
]
frameworks = [
  "CIS Microsoft Windows Server Benchmark",
  "NIST 800-53 SC-8",
  "NIST 800-52",
]
verify = '''
Get-ChildItem 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols' -Recurse |
  Get-ItemProperty | Select-Object PSPath, Enabled, DisabledByDefault'''
cvss = "AV:N/AC:H/PR:N/UI:N/S:U/C:L/I:L/A:N"
mitre = ["T1040", "T1557"]

