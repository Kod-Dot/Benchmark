[[check]]
id = "EN-PRIV-019"
title = "Privileged roles assigned through nested or dynamic groups"
status = "implemented"
severity = "medium"

[check.detail]
description = "A group that holds a privileged role contains other groups, or has dynamic membership."
impact = "Nested and dynamic membership hide who really holds the role: anyone who can change the inner group, or the attributes the rule uses, gets the role."
remediation = [
  "Put users directly in role-assignable groups, or assign the role directly with PIM.",
