[[check]]
id = "EN-PRIV-018"
title = "Partner relationships (GDAP / DAP) and delegated admin privileges"
status = "implemented"
severity = "medium"

[check.detail]
description = "The tenant has one or more partner relationships with delegated admin privileges (DAP). DAP gives the partner's admin agents broad roles in this tenant, usually Global Administrator, with no expiry."
impact = "A compromise of the partner's tenant or of one of its admin agents gives the attacker Global Administrator access to this tenant, outside this organization's own sign-in controls."
attack = [
  "Compromises a partner (for example an MSP) that has delegated admin privileges in many customer tenants.",
  "Uses the partner relationship to sign in to this tenant with Global Administrator rights.",
  "Exfiltrates data or creates persistent access.",
]
remediation = [
  "In the Microsoft 365 admin center, go to Settings > Partner relationships and review each partner and its roles.",
