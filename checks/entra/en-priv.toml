[[check]]
id = "EN-PRIV-016"
title = "\"Access management for Azure resources\" (root elevate) toggled on"
status = "implemented"
severity = "critical"

[check.detail]
description = "A principal holds User Access Administrator at the root scope (\"/\"). This is what \"Access management for Azure resources\" grants a Global Administrator, and it stays until it is turned off."
impact = "The principal can give itself any role on every subscription and management group in the tenant."
remediation = [
  "Turn off \"Access management for Azure resources\" in the Entra properties, or remove the assignment: Remove-AzRoleAssignment -Scope / -RoleDefinitionName 'User Access Administrator' -ObjectId <id>.",
]
verify = "Get-AzRoleAssignment -Scope / -RoleDefinitionName 'User Access Administrator'"
mitre = ["T1098", "T1078.004"]

