[[check]]
id = "EN-PRIV-022"
title = "Roles with Tier 0 equivalence (Application Admin, Cloud App Admin, Hybrid Identity Admin)"
status = "implemented"
severity = "high"

[check.detail]
description = "Application Administrator, Cloud Application Administrator, Hybrid Identity Administrator or Authentication Administrator is held as a permanent active assignment instead of an eligible assignment in PIM."
impact = "These roles can reach Global Administrator indirectly, for example by adding credentials to a privileged application or changing federation and sync settings, and a permanent assignment makes that path usable at any time."
attack = [
  "Compromises an account that holds one of these roles permanently.",
  "Adds a secret to an application or service principal that holds high privileges, or changes hybrid identity settings.",
  "Authenticates as the application and acts with its privileges.",
]
remediation = [
  "In the Microsoft Entra admin center, go to Identity governance > Privileged Identity Management > Microsoft Entra roles > Assignments and review the active assignments of these roles.",
  "Convert them to eligible assignments with MFA and justification on activation.",
  "Reduce the number of holders, and scope application management to specific apps where possible.",
]
verify = "Get-MgRoleManagementDirectoryRoleAssignmentScheduleInstance -All -ExpandProperty Principal | Where-Object { $_.AssignmentType -eq 'Assigned' }"
cvss = "AV:N/AC:H/PR:N/UI:R/S:U/C:H/I:H/A:N"
mitre = ["T1098", "T1078.004", "T1098.003"]

[[check.detail.references]]
title = "Privileged roles and permissions in Microsoft Entra ID"
url = "https://learn.microsoft.com/entra/identity/role-based-access-control/privileged-roles-permissions"

[[check.detail.references]]
title = "Configure Microsoft Entra role settings in PIM"
url = "https://learn.microsoft.com/entra/id-governance/privileged-identity-management/pim-how-to-change-default-settings"
