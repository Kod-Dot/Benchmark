[[check]]
id = "EN-PRIV-017"
title = "Directory synchronization accounts role holders"
status = "implemented"
severity = "high"

[check.detail]
description = "The Directory Synchronization Accounts role is held by one or more accounts that are not the Microsoft Entra Connect or Cloud Sync service account (named Sync_* or On-Premises Directory Synchronization Service Account)."
impact = "The role carries the directory write permissions used by the synchronization service and is meant for that one account. An extra holder is a privileged identity that is easy to overlook and can be used to change synchronized objects."
attack = [
  "Assigns the role to an account it controls, or compromises an account that was given it.",
  "Uses the synchronization permissions to change users or credentials of synchronized accounts.",
  "Keeps the access because the role is rarely reviewed.",
]
remediation = [
  "In the Microsoft Entra admin center, go to Identity > Roles & admins > Directory Synchronization Accounts and review every assignment.",
  "Remove the role from any account that is not the service account created by Entra Connect or Cloud Sync.",
  "Investigate how the extra assignment was made using the audit logs for the Add member to role activity.",
]
verify = "Get-MgRoleManagementDirectoryRoleAssignment -Filter \"roleDefinitionId eq 'd29b2b05-8046-44ba-8758-1e26182fcf32'\" -ExpandProperty Principal"
cvss = "AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N"
mitre = ["T1098", "T1078.004"]

