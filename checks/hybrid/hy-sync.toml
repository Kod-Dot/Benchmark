[[check]]
id = "HY-SYNC-012"
title = "Staging server configuration consistency"
status = "implemented"
severity = "medium"

[check.detail]
description = "More than one sync server is active, none is, or a staging server runs a different version or different features from the active one. Read on the server itself (the identity part); add AD FS and sync servers to the endpoint targets."
impact = "Two active servers fight over the directory; a mismatched staging server cannot take over cleanly in a disaster."
remediation = [
  "Keep one active server and a staging server on the same version and configuration.",
]
verify = "Get-ADSyncScheduler | Select-Object StagingModeEnabled on each server"

[[check.detail.references]]
title = "Staging server"
url = "https://learn.microsoft.com/entra/identity/hybrid/connect/how-to-connect-sync-staging-server"

[[check]]
id = "HY-SYNC-013"
title = "Cloud Sync agents inventory and gMSA used"
status = "implemented"
severity = "high"

[check.detail]
description = "A Cloud Sync provisioning agent does not run as a gMSA, or runs on a server that is not Tier 0. Read on the server itself (the identity part); add AD FS and sync servers to the endpoint targets."
impact = "The agent's account writes to AD; a password-based account or a lower-tier server exposes it."
remediation = [
  "Reinstall the agent with a gMSA and keep it on Tier 0 servers.",
]
verify = "Get-CimInstance Win32_Service -Filter \"Name='AADConnectProvisioningAgent'\" | Select-Object StartName"

[[check.detail.references]]
title = "Cloud Sync gMSA"
url = "https://learn.microsoft.com/entra/identity/hybrid/cloud-sync/how-to-prerequisites"

[[check]]
id = "HY-SYNC-014"
title = "Seamless SSO enabled and AZUREADSSOACC key rollover age"
status = "implemented"
severity = "medium"

[check.detail]
description = "Seamless SSO is set up (the AZUREADSSOACC computer account exists in AD) and the account password, which is the Kerberos decryption key shared with Entra ID, is older than 30 days."
impact = "Anyone who obtains the AZUREADSSOACC key can forge Kerberos tickets for any synchronized user and sign in to Entra ID as them. An old key gives a stolen copy a long useful life."
attack = [
  "Obtains the AZUREADSSOACC password hash, for example with DCSync.",
  "Forges a Kerberos service ticket for a chosen synchronized user.",
  "Exchanges the ticket for an Entra ID sign-in as that user.",
]
remediation = [
  "Roll over the Kerberos decryption key with Update-AzureADSSOForest from the AzureADSSO module on the Microsoft Entra Connect server.",
  "Repeat the rollover at least every 30 days.",
  "If Seamless SSO is no longer needed, turn it off in Microsoft Entra Connect and then remove the AZUREADSSOACC account.",
]
verify = "Get-ADComputer AZUREADSSOACC -Properties PasswordLastSet | Select-Object Name, PasswordLastSet"
cvss = "AV:N/AC:H/PR:H/UI:N/S:U/C:H/I:H/A:N"
mitre = ["T1558", "T1556.007", "T1078.004"]

[[check.detail.references]]
title = "Microsoft Entra Seamless single sign-on: Frequently asked questions"
url = "https://learn.microsoft.com/entra/identity/hybrid/connect/how-to-connect-sso-faq"

[[check]]
id = "HY-SYNC-015"
title = "Pass-through Authentication agents inventory and placement"
status = "implemented"
severity = "critical"

[check.detail]
description = "A pass-through authentication agent runs on a server that is not Tier 0. Read on the server itself (the identity part); add AD FS and sync servers to the endpoint targets."
impact = "Each agent sees the clear-text password of every cloud sign-in it validates; whoever controls the server can read them."
remediation = [
  "Run pass-through agents only on Tier 0 servers (domain controllers or dedicated Tier 0 servers), at least three for resilience.",
]
verify = "Entra admin center > Entra Connect > Pass-through authentication agents"
mitre = ["T1556"]

[[check.detail.references]]
title = "Pass-through authentication security"
url = "https://learn.microsoft.com/entra/identity/hybrid/connect/how-to-connect-pta-security-deep-dive"

[[check]]
id = "HY-SYNC-016"
title = "Attribute filtering and duplicate attribute resiliency errors"
status = "implemented"
severity = "low"

[check.detail]
description = "Synchronized users or groups in Entra ID have on-premises provisioning errors, for example a duplicate UPN or a proxyAddresses conflict."
impact = "Affected objects are not fully synchronized: changes made on-premises may not reach Entra ID, and an object can sign in or receive mail under an unexpected address."
attack = [
  "Creates an on-premises object with a proxy address or UPN that conflicts with an existing user.",
  "Relies on the conflict going unnoticed to receive mail or cause confusion about which account is real.",
]
remediation = [
  "Review the errors in Microsoft Entra Connect Health or with Get-MgUser and onPremisesProvisioningErrors.",
  "Fix the conflicting attribute on the right on-premises object after confirming which object should own it.",
  "Run a sync cycle and confirm the errors clear.",
]
verify = "Get-MgUser -All -Property userPrincipalName,onPremisesProvisioningErrors | Where-Object { $_.OnPremisesProvisioningErrors } | Select-Object UserPrincipalName, OnPremisesProvisioningErrors"
cvss = "AV:N/AC:H/PR:L/UI:N/S:U/C:N/I:L/A:L"
mitre = ["T1078.004"]

[[check.detail.references]]
title = "Identity synchronization and duplicate attribute resiliency"
url = "https://learn.microsoft.com/entra/identity/hybrid/connect/how-to-connect-syncservice-duplicate-attribute-resiliency"
