[[check]]
id = "M365-EXO-011"
title = "EWS / Graph impersonation role assignments"
status = "implemented"
severity = "high"

[check.detail]
description = "One or more principals are assigned the ApplicationImpersonation management role. This role lets an account or application act as any mailbox user it is scoped to through Exchange Web Services, and by default the scope is the whole organization."
impact = "A compromised account or application with ApplicationImpersonation can read, send and delete mail as any user, which gives full access to the organization's mail."
attack = [
  "Compromises the account or the credentials of the service that holds ApplicationImpersonation.",
  "Connects to Exchange Web Services and impersonates a target mailbox.",
  "Reads or exports mail from any mailbox in the role's scope.",
]
remediation = [
  "Remove ApplicationImpersonation assignments that are no longer needed with Remove-ManagementRoleAssignment.",
  "Move the remaining applications to Microsoft Graph with application permissions scoped through RBAC for Applications.",
  "If an assignment must stay, scope it to a management scope containing only the required mailboxes.",
]
frameworks = [
  "CIS Microsoft 365 Foundations Benchmark",
  "NIST 800-53 AC-6",
]
verify = '''
Get-ManagementRoleAssignment -Role ApplicationImpersonation | Select-Object Name, RoleAssignee, RecipientWriteScope, CustomRecipientWriteScope'''
cvss = "AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:N"
mitre = ["T1078.004", "T1098.003"]

