[[check]]
id = "M365-EXO-024"
title = "DMARC records and policy strength (p=none vs quarantine/reject)"
status = "implemented"
severity = "high"

[check.detail]
description = "An accepted domain has no DMARC record at _dmarc.<domain>, more than one DMARC record, an invalid record, a policy of p=none, or a pct value below 100."
impact = "Without an enforced DMARC policy, receiving servers deliver mail that spoofs the domain's exact sender address. Attackers use this for phishing and invoice fraud against both customers and employees."
attack = [
  "Looks up the domain's DMARC record and sees that it is missing or set to p=none.",
  "Sends mail with the organization's exact domain in the From address.",
  "Recipients see a genuine-looking sender and act on the message.",
]
remediation = [
  "Publish one TXT record at _dmarc.<domain> starting with v=DMARC1 and a rua address to collect aggregate reports.",
  "After reviewing reports and fixing legitimate senders, move the policy to p=quarantine and then p=reject, with pct=100 (or no pct tag).",
  "For domains that never send mail, publish p=reject straight away.",
]
frameworks = [
  "CIS Microsoft 365 Foundations Benchmark",
  "NIST 800-53 SI-8",
]
verify = '''
Get-AcceptedDomain | ForEach-Object { Resolve-DnsName -Name "_dmarc.$($_.DomainName)" -Type TXT -ErrorAction SilentlyContinue | Select-Object Name, Strings }'''
