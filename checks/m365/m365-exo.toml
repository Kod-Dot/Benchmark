title = "Role Based Access Control for Applications in Exchange Online"
url = "https://learn.microsoft.com/exchange/permissions-exo/application-rbac"

[[check]]
id = "M365-EXO-012"
title = "Exchange admin role groups membership (Organization Management, etc.)"
status = "implemented"
severity = "medium"

[check.detail]
description = "The Organization Management, Recipient Management, Discovery Management, Compliance Management, Records Management or Hygiene Management role groups have direct members. Direct members are added in Exchange Online itself, unlike the Entra-linked members (named like TenantAdmins_-123456) that come from Microsoft Entra roles."
impact = "Direct members hold powerful Exchange permissions, such as changing mail flow, granting mailbox access or searching all mailboxes, that do not appear in Microsoft Entra role reviews, Privileged Identity Management or access reviews, so they are easily forgotten."
attack = [
  "Compromises an account that was added directly to an Exchange role group.",
  "Uses the role to grant itself mailbox permissions, create transport rules or run content searches.",
  "Keeps that access unnoticed because it is not visible in Entra role assignments.",
]
remediation = [
  "Review the direct members of each role group and remove those without a current need with Remove-RoleGroupMember.",
  "Grant Exchange administration through Microsoft Entra roles (Exchange Administrator) managed in Privileged Identity Management instead of direct role group membership.",
  "Review the remaining direct members on a schedule.",
]
frameworks = [
  "CIS Microsoft 365 Foundations Benchmark",
  "NIST 800-53 AC-2",
  "NIST 800-53 AC-6",
]
verify = '''
'Organization Management','Recipient Management','Discovery Management','Compliance Management','Records Management','Hygiene Management' |
  ForEach-Object { $g = $_; Get-RoleGroupMember -Identity $g | Select-Object @{n='RoleGroup';e={$g}}, Name, RecipientType }'''
cvss = "AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:L"
mitre = ["T1098.003", "T1069.003"]

[[check.detail.references]]
title = "Permissions in Exchange Online"
url = "https://learn.microsoft.com/exchange/permissions-exo/permissions-exo"

[[check]]
id = "M365-EXO-013"
title = "Shared mailboxes with sign-in enabled"
status = "implemented"
severity = "medium"

[check.detail]
description = "One or more shared mailboxes have an enabled Microsoft Entra user account, so someone who knows or sets the account's password can sign in to the shared mailbox directly instead of through delegated access."
impact = "Shared mailbox accounts are rarely covered by MFA or monitored like normal users. A direct sign-in bypasses the per-user access model, and actions taken in the mailbox cannot be tied to a person."
attack = [
  "Finds a shared mailbox account and sprays common passwords against it.",
  "Signs in directly as the shared mailbox.",
  "Reads and sends mail from it without being linked to a named user.",
]
remediation = [
  "Block sign-in for each shared mailbox account in the Microsoft 365 admin center (Users > Active users, select the account, Block sign-in) or with Update-MgUser -AccountEnabled:$false.",
  "Give users access to the shared mailbox through Full Access and Send As permissions instead.",
]
frameworks = [
  "CIS Microsoft 365 Foundations Benchmark",
  "NIST 800-53 AC-2",
]
verify = '''
Get-Mailbox -RecipientTypeDetails SharedMailbox -ResultSize Unlimited |
  Select-Object PrimarySmtpAddress, AccountDisabled'''
cvss = "AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:N"
mitre = ["T1078.004", "T1110.003"]

[[check.detail.references]]
title = "About shared mailboxes"
url = "https://learn.microsoft.com/microsoft-365/admin/email/about-shared-mailboxes"

[[check]]
id = "M365-EXO-014"
title = "Anti-phishing policy: impersonation protection, mailbox intelligence, spoof intelligence"
status = "implemented"
severity = "medium"

[check.detail]
description = "An anti-phishing policy in force is missing one or more protections: spoof intelligence, mailbox intelligence, mailbox intelligence based impersonation protection, or user and domain impersonation protection."
impact = "Mail that impersonates executives, partners or the organization's own domains is more likely to reach inboxes, which raises the success rate of phishing and business email compromise."
attack = [
  "Registers a lookalike domain or display name of an executive or a trusted partner.",
  "Sends payment or credential requests that impersonate that person.",
  "Gets a user to reply, pay or enter credentials.",
]
remediation = [
  "In the Microsoft Defender portal, go to Email & collaboration > Policies & rules > Threat policies > Anti-phishing and edit the policies in force.",
  "Turn on spoof intelligence, mailbox intelligence and intelligence for impersonation protection (Set-AntiPhishPolicy -EnableSpoofIntelligence $true -EnableMailboxIntelligence $true -EnableMailboxIntelligenceProtection $true).",
  "Add executives and other high-value users to user impersonation protection, and add owned and partner domains to domain impersonation protection, with a quarantine action.",
  "Or adopt the Standard or Strict preset security policy (see M365-EXO-026).",
]
frameworks = [
  "CIS Microsoft 365 Foundations Benchmark",
  "NIST 800-53 SI-8",
]
verify = '''
Get-AntiPhishPolicy | Select-Object Name, Enabled, EnableSpoofIntelligence, EnableMailboxIntelligence,
  EnableMailboxIntelligenceProtection, EnableTargetedUserProtection, EnableTargetedDomainsProtection, EnableOrganizationDomainsProtection'''
cvss = "AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:L/A:N"
mitre = ["T1566.002"]

[[check.detail.references]]
title = "Anti-phishing policies in Microsoft 365"
url = "https://learn.microsoft.com/defender-office-365/anti-phishing-policies-about"

[[check]]
id = "M365-EXO-015"
title = "Safe Links policy coverage"
status = "implemented"
severity = "medium"

[check.detail]
description = "No Safe Links policy in force checks links in email, or a policy in force does not scan URLs in real time (ScanUrls) or lets users click through to the original URL (AllowClickThrough)."
impact = "Links in phishing mail are not checked at click time, so a link that was harmless at delivery and turned malicious later still reaches users, and warnings can be ignored."
attack = [
  "Sends mail with a link that points to a harmless page at delivery time.",
  "Switches the page to a credential phishing site after the mail is delivered.",
  "Collects the passwords or session tokens of users who click.",
]
remediation = [
  "In the Microsoft Defender portal, go to Email & collaboration > Policies & rules > Threat policies > Safe Links and create or edit a policy that covers all recipients.",
  "Turn on link checking for email, real-time URL scanning and scanning before delivery, and turn off Let users click through to the original URL (Set-SafeLinksPolicy -EnableSafeLinksForEmail $true -ScanUrls $true -AllowClickThrough $false).",
  "Or adopt the Standard or Strict preset security policy (see M365-EXO-026).",
]
frameworks = [
  "CIS Microsoft 365 Foundations Benchmark",
  "NIST 800-53 SI-3",
]
verify = '''
Get-SafeLinksPolicy | Select-Object Name, EnableSafeLinksForEmail, ScanUrls, AllowClickThrough
Get-SafeLinksRule | Select-Object Name, SafeLinksPolicy, State'''
cvss = "AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:L/A:N"
mitre = ["T1566.002"]

[[check.detail.references]]
title = "Safe Links in Microsoft Defender for Office 365"
url = "https://learn.microsoft.com/defender-office-365/safe-links-about"

[[check]]
id = "M365-EXO-016"
title = "Safe Attachments policy coverage and dynamic delivery"
status = "implemented"
severity = "medium"

[check.detail]
description = "No Safe Attachments policy in force is enabled with an action other than Allow, or Safe Attachments for SharePoint, OneDrive and Microsoft Teams is off (EnableATPForSPOTeamsODB is false in the ATP policy)."
impact = "Attachments and shared files are not detonated in a sandbox before users open them, so new or targeted malware that signature scanning misses can reach users."
attack = [
  "Sends a weaponized document that common antivirus does not yet detect, or uploads it to a shared SharePoint or Teams location.",
  "Waits for a user to open the file.",
  "Runs code on the user's device and steals credentials or tokens.",
]
remediation = [
  "In the Microsoft Defender portal, go to Email & collaboration > Policies & rules > Threat policies > Safe Attachments and create or edit a policy that covers all recipients with the Block or Dynamic Delivery action.",
  "Turn on Safe Attachments for SharePoint, OneDrive and Microsoft Teams in the global settings (Set-AtpPolicyForO365 -EnableATPForSPOTeamsODB $true).",
