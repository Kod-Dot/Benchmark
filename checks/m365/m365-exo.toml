title = "Mail flow rules (transport rules) in Exchange Online"
url = "https://learn.microsoft.com/exchange/security-and-compliance/mail-flow-rules/mail-flow-rules"

[[check]]
id = "M365-EXO-021"
title = "Connectors: inbound connectors without TLS/cert restriction, outbound to unknown smarthosts"
status = "implemented"
severity = "medium"

[check.detail]
description = "An inbound connector does not require TLS (RequireTls is false) or does not restrict senders by certificate name or source IP address, or an outbound connector that routes mail to a smart host has no TLS settings."
impact = "An inbound connector without a certificate or IP restriction can be matched by mail an attacker sends, which may then be treated as trusted partner or on-premises mail. Outbound mail to a smart host without TLS can be read or changed in transit."
attack = [
  "Finds a partner or on-premises inbound connector that is not tied to a certificate or IP range.",
  "Sends mail that matches the connector so it is treated as trusted.",
  "Or intercepts outbound mail to a smart host that is sent without TLS.",
]
remediation = [
  "In the Exchange admin center, go to Mail flow > Connectors and edit each inbound connector to require TLS and to accept mail only from the partner's certificate name (TlsSenderCertificateName) or IP ranges (SenderIPAddresses).",
  "Set outbound connectors that use a smart host to always use TLS and validate the certificate (Set-OutboundConnector -TlsSettings DomainValidation or CertificateValidation).",
  "Remove connectors that are no longer used.",
]
frameworks = [
  "NIST 800-53 SC-8",
  "NIST 800-53 AC-4",
]
verify = '''
Get-InboundConnector | Select-Object Name, Enabled, ConnectorType, RequireTls, RestrictDomainsToCertificate, RestrictDomainsToIPAddresses, TlsSenderCertificateName, SenderIPAddresses
Get-OutboundConnector | Select-Object Name, Enabled, UseMXRecord, SmartHosts, TlsSettings, TlsDomain'''
cvss = "AV:N/AC:H/PR:N/UI:N/S:U/C:L/I:L/A:N"
mitre = ["T1557", "T1199"]

