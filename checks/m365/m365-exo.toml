url = "https://learn.microsoft.com/exchange/clients-and-mobile-in-exchange-online/authenticated-client-smtp-submission"

[[check]]
id = "M365-EXO-004"
title = "External auto-forwarding allowed (remote domains, outbound spam policy)"
status = "implemented"
severity = "high"

[check.detail]
description = "An outbound spam policy in force (the default policy or one applied by an enabled rule) has AutoForwardingMode set to On, and at least one remote domain has AutoForwardEnabled set to true. Together these let mailboxes automatically forward mail to external recipients."
impact = "A compromised mailbox, or a user who sets up forwarding, can silently send a copy of every message to an outside address. The copies keep flowing after a password reset until the forwarding is found and removed."
attack = [
  "Signs in to a user's mailbox with a stolen password or token.",
  "Adds an inbox rule or mailbox forwarding to an external address it controls.",
  "Receives copies of all incoming mail, including password resets and invoices, without signing in again.",
]
remediation = [
  "In the Microsoft Defender portal, go to Email & collaboration > Policies & rules > Threat policies > Anti-spam, open each outbound policy and set Automatic forwarding rules to Off, Forwarding is disabled (Set-HostedOutboundSpamFilterPolicy -AutoForwardingMode Off).",
  "Create a separate outbound policy with forwarding On only for the users who have an approved business need.",
  "Set AutoForwardEnabled to false on the default remote domain (Set-RemoteDomain Default -AutoForwardEnabled $false) and on other remote domains that do not need it.",
]
frameworks = [
  "CIS Microsoft 365 Foundations Benchmark",
  "NIST 800-53 AC-4",
]
verify = '''
Get-HostedOutboundSpamFilterPolicy | Select-Object Name, IsDefault, AutoForwardingMode
Get-RemoteDomain | Select-Object Name, DomainName, AutoForwardEnabled'''
cvss = "AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N"
mitre = ["T1078.004"]

