[[check]]
id = "M365-EXO-020"
title = "Transport rules bypassing filtering (SCL -1) or redirecting mail"
status = "implemented"
severity = "high"

[check.detail]
description = "One or more enabled mail flow (transport) rules set the spam confidence level to -1, set headers that skip Defender processing (such as X-MS-Exchange-Organization-SkipSafeLinksProcessing or SkipSafeAttachmentProcessing), or redirect, blind copy or copy mail to external addresses."
impact = "Mail matched by a bypass rule is delivered without spam, phishing, Safe Links or Safe Attachments checks. A rule that copies or redirects mail to an outside address sends the organization's mail out silently, and is a common persistence method after an admin account is compromised."
attack = [
  "Finds a rule that bypasses filtering for a trusted sender, IP range or header, and sends phishing mail that matches it.",
  "With an admin account, creates a rule that blind copies selected mail to an external address it controls.",
  "Receives the copied mail or lands malicious mail in inboxes without filtering.",
]
remediation = [
  "In the Exchange admin center, go to Mail flow > Rules and review each rule that sets SCL to -1, sets Skip headers or redirects or copies mail outside the organization.",
  "Remove or disable rules without a documented reason; narrow the remaining bypass rules to specific, authenticated senders instead of domains or headers that can be spoofed.",
  "Use the advanced delivery policy for third-party phishing simulations and security mailboxes instead of SCL -1 rules.",
]
frameworks = [
  "CIS Microsoft 365 Foundations Benchmark",
  "NIST 800-53 AC-4",
  "NIST 800-53 SI-8",
]
verify = '''
Get-TransportRule | Where-Object { $_.State -eq 'Enabled' -and ($_.SetSCL -eq -1 -or $_.SetHeaderName -or $_.RedirectMessageTo -or $_.BlindCopyTo -or $_.CopyTo) } |
  Select-Object Name, Priority, SetSCL, SetHeaderName, SetHeaderValue, RedirectMessageTo, BlindCopyTo, CopyTo'''
cvss = "AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:L/A:N"
mitre = ["T1566.002", "T1078.004"]

