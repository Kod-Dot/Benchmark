[[check]]
id = "M365-EXO-006"
title = "Inbox rules forwarding, deleting or hiding mail (compromise indicator)"
status = "implemented"
severity = "high"

[check.detail]
description = "An enabled inbox rule forwards or redirects mail outside the organization's domains, deletes messages, or moves them to folders users rarely open (RSS, Conversation History, Archive) and marks them read. Up to 500 mailboxes are read."
impact = "These rules are the classic sign of a compromised mailbox: attackers forward mail out and hide replies from the real owner."
remediation = [
  "Review each rule with the mailbox owner, remove those they did not create, and reset the account's credentials and sessions.",
]
verify = "Get-InboxRule -Mailbox <user> | Format-List Name, Enabled, ForwardTo, RedirectTo, DeleteMessage, MoveToFolder"
mitre = ["T1564"]

[[check.detail.references]]
title = "Detect and remediate Outlook rules injection"
url = "https://learn.microsoft.com/defender-office-365/detect-and-remediate-outlook-rules-forms-attack"

[[check]]
id = "M365-EXO-007"
title = "Mailbox auditing enabled by default and audit bypass accounts"
status = "implemented"
severity = "medium"

[check.detail]
description = "Mailbox auditing is turned off for the organization (AuditDisabled is true in the organization configuration), or one or more accounts have a mailbox audit bypass association (AuditBypassEnabled is true), so their actions in mailboxes are not logged."
impact = "Without mailbox audit records, investigators cannot tell which messages an attacker read, sent or deleted. An account with audit bypass can access mailboxes without leaving any mailbox audit record."
attack = [
  "Gains control of an account that has audit bypass, or operates in a tenant with mailbox auditing off.",
  "Reads, sends or deletes mail in the mailboxes it can access.",
  "Leaves no mailbox audit records for investigators to follow.",
]
remediation = [
  "Turn mailbox auditing on by default with Set-OrganizationConfig -AuditDisabled $false.",
  "Review every audit bypass association and remove those without a documented reason with Set-MailboxAuditBypassAssociation -AuditBypassEnabled $false.",
]
frameworks = [
  "CIS Microsoft 365 Foundations Benchmark",
  "NIST 800-53 AU-2",
  "NIST 800-53 AU-12",
]
verify = '''
Get-OrganizationConfig | Select-Object AuditDisabled
Get-MailboxAuditBypassAssociation -ResultSize Unlimited | Where-Object { $_.AuditBypassEnabled } | Select-Object Name'''
cvss = "AV:N/AC:H/PR:H/UI:N/S:U/C:L/I:L/A:N"
mitre = ["T1078.004"]

[[check.detail.references]]
title = "Manage mailbox auditing"
url = "https://learn.microsoft.com/purview/audit-mailboxes"

[[check.detail.references]]
title = "Get-MailboxAuditBypassAssociation"
url = "https://learn.microsoft.com/powershell/module/exchange/get-mailboxauditbypassassociation"

[[check]]
id = "M365-EXO-008"
title = "Unified audit log ingestion enabled"
status = "implemented"
severity = "high"

[check.detail]
description = "UnifiedAuditLogIngestionEnabled is false in the admin audit log configuration, so user and admin activity across Microsoft 365 is not recorded in the unified audit log."
impact = "Without the unified audit log there is no record of sign-ins to mailboxes, file access, sharing, mail rule changes or admin actions to investigate a compromise or prove what was accessed."
attack = [
  "Compromises an account in a tenant where the unified audit log is off.",
  "Reads mail, downloads files and changes settings.",
  "Leaves no audit records, so the scope of the breach cannot be determined.",
]
remediation = [
  "In the Microsoft Purview portal, go to Audit and select Start recording user and admin activity.",
  "Or run Set-AdminAuditLogConfig -UnifiedAuditLogIngestionEnabled $true in Exchange Online PowerShell.",
  "Forward audit records to a SIEM and set a retention period that meets your investigation needs.",
]
frameworks = [
  "CIS Microsoft 365 Foundations Benchmark",
  "NIST 800-53 AU-2",
  "NIST 800-53 AU-12",
]
verify = '''
Get-AdminAuditLogConfig | Select-Object UnifiedAuditLogIngestionEnabled'''
cvss = "AV:N/AC:H/PR:H/UI:N/S:U/C:L/I:L/A:N"

[[check.detail.references]]
title = "Turn auditing on or off"
url = "https://learn.microsoft.com/purview/audit-log-enable-disable"

[[check]]
id = "M365-EXO-009"
title = "Full Access / Send As / Send on Behalf permissions granted to unexpected users"
status = "implemented"
severity = "medium"

[check.detail]
description = "Full Access, Send As or Send on Behalf is granted to an external guest, on an admin's mailbox, or Full Access to one account over ten or more mailboxes. Full Access is read for up to 500 mailboxes."
impact = "Delegated access lets the trustee read or send as the mailbox owner; broad or external grants are a common persistence and fraud route."
remediation = [
  "Remove grants that are not needed and review the rest with the mailbox owners.",
]
verify = "Get-EXOMailboxPermission -Identity <mailbox>; Get-EXORecipientPermission -Identity <mailbox>"
mitre = ["T1098"]

[[check.detail.references]]
title = "Manage mailbox permissions"
url = "https://learn.microsoft.com/exchange/recipients-in-exchange-online/manage-permissions-for-recipients"

[[check]]
id = "M365-EXO-010"
title = "Application access policies for apps with Mail.* application permissions (RBAC for Applications)"
status = "implemented"
severity = "high"

[check.detail]
description = "One or more non-Microsoft applications have application permissions to mailbox data (Mail.*, MailboxSettings.*, Calendars.*, Contacts.* or full_access_as_app), and no application access policy (Get-ApplicationAccessPolicy) limits the app id to a set of mailboxes. Application permissions apply to every mailbox in the organization by default."
impact = "Anyone holding the application's secret or certificate can read or send mail, calendars and contacts for every mailbox in the tenant, including executives, without any user signing in."
attack = [
  "Steals the client secret or certificate of an application with mailbox application permissions, or adds its own credential to the app.",
  "Requests an app-only token for Microsoft Graph or Exchange Web Services.",
  "Reads or exports mail from any mailbox in the organization.",
]
remediation = [
  "Remove mailbox application permissions the application does not need, or replace them with delegated permissions.",
  "Scope each remaining application to the mailboxes it needs with RBAC for Applications (New-ManagementScope and New-ManagementRoleAssignment for the app's service principal), which replaces application access policies.",
  "Until RBAC for Applications is in place, limit the app with New-ApplicationAccessPolicy -AccessRight RestrictAccess and a mail-enabled security group of allowed mailboxes.",
  "Review who can manage the application's credentials in Microsoft Entra ID.",
]
frameworks = [
  "CIS Microsoft 365 Foundations Benchmark",
  "NIST 800-53 AC-6",
]
verify = '''
Get-ApplicationAccessPolicy | Select-Object AppId, AccessRight, ScopeName
Get-ManagementRoleAssignment -RoleAssigneeType ServicePrincipal | Select-Object Role, RoleAssigneeName, CustomResourceScope'''
cvss = "AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:N"
mitre = ["T1528", "T1098.001", "T1550"]

