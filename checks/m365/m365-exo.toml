  Resolve-DnsName -Name "_smtp._tls.$($_.DomainName)" -Type TXT -ErrorAction SilentlyContinue | Select-Object Name, Strings }'''
cvss = "AV:A/AC:H/PR:N/UI:N/S:U/C:L/I:L/A:N"
