[[check]]
id = "M365-EXO-022"
title = "SPF records for all accepted domains"
status = "implemented"
severity = "medium"

[check.detail]
description = "An accepted domain has no SPF record, more than one SPF record, an SPF record ending in +all or ?all, or an SPF record with no all mechanism, based on a DNS lookup of the domain's TXT records."
impact = "Receiving mail servers cannot tell which servers may send mail for the domain, so mail spoofing the domain is more likely to be accepted, both by partners and by the organization's own users."
attack = [
  "Looks up the domain's SPF record and sees that it is missing or permissive.",
  "Sends phishing mail with the organization's domain in the sender address from its own server.",
  "Receiving servers accept the mail because SPF does not reject it.",
]
remediation = [
  "Publish exactly one TXT record starting with v=spf1 for each accepted domain that lists the servers allowed to send, including include:spf.protection.outlook.com for Exchange Online.",
  "End the record with -all (or ~all while DMARC enforcement is in place).",
  "For domains that never send mail, publish v=spf1 -all.",
]
frameworks = [
  "CIS Microsoft 365 Foundations Benchmark",
  "NIST 800-53 SI-8",
]
verify = '''
Get-AcceptedDomain | ForEach-Object { Resolve-DnsName -Name $_.DomainName -Type TXT | Where-Object { $_.Strings -like 'v=spf1*' } | Select-Object Name, Strings }'''
cvss = "AV:N/AC:L/PR:N/UI:R/S:U/C:L/I:L/A:N"
mitre = ["T1566.002"]

