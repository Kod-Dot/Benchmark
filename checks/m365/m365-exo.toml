[[check]]
id = "M365-EXO-005"
title = "Mailbox forwarding rules to external addresses (ForwardingSmtpAddress)"
status = "implemented"
severity = "high"

[check.detail]
description = "One or more mailboxes have ForwardingSmtpAddress set to an address whose domain is not one of the organization's accepted domains, so mail to the mailbox is forwarded outside the organization."
impact = "Every message sent to the mailbox, possibly including confidential data, password reset links and invoices, is copied or redirected to an external address. Forwarding set by an attacker keeps working after the account's password is reset."
attack = [
  "Signs in to a user's mailbox with a stolen password or token.",
  "Sets mailbox forwarding to an external address it controls, often keeping a copy in the mailbox so the user notices nothing.",
  "Reads the forwarded mail to plan invoice fraud or further phishing.",
]
remediation = [
  "Confirm with each mailbox owner whether the forwarding is expected; treat unexplained forwarding as a possible compromise and investigate the account's sign-ins.",
  "Remove unwanted forwarding with Set-Mailbox -ForwardingSmtpAddress $null -DeliverToMailboxAndForward $false.",
  "Block external automatic forwarding in the outbound spam policy (see M365-EXO-004).",
]
frameworks = [
  "CIS Microsoft 365 Foundations Benchmark",
  "NIST 800-53 AC-4",
]
verify = '''
Get-EXOMailbox -ResultSize Unlimited -Properties ForwardingSmtpAddress, DeliverToMailboxAndForward |
  Where-Object { $_.ForwardingSmtpAddress } |
  Select-Object PrimarySmtpAddress, ForwardingSmtpAddress, DeliverToMailboxAndForward'''
cvss = "AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N"
mitre = ["T1078.004"]

