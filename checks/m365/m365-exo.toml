# M365-EXO: Exchange Online

area = "M365-EXO"

[[check]]
id = "M365-EXO-001"
title = "Modern authentication enabled organization-wide"
status = "implemented"
severity = "medium"

[check.detail]
description = "OAuth2ClientProfileEnabled is false in the Exchange Online organization configuration, so Outlook and other clients do not use modern authentication (OAuth 2.0) to connect to Exchange Online."
impact = "Clients that cannot use modern authentication do not get multi-factor authentication, Conditional Access or token-based sign-in, and users get repeated password prompts that encourage weaker habits."
attack = [
  "Collects or guesses a user's password, for example through password spraying.",
  "Signs in through a client that does not use modern authentication, so the sign-in is not covered by MFA or Conditional Access.",
  "Reads the user's mail and contacts.",
]
remediation = [
  "Turn on modern authentication with Set-OrganizationConfig -OAuth2ClientProfileEnabled $true.",
  "Make sure Outlook clients are recent versions that support modern authentication.",
]
frameworks = [
  "CIS Microsoft 365 Foundations Benchmark",
  "NIST 800-53 IA-2",
]
verify = '''
Get-OrganizationConfig | Select-Object OAuth2ClientProfileEnabled'''
cvss = "AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:L/A:N"
mitre = ["T1078.004", "T1110.003"]

[[check.detail.references]]
title = "Enable or disable modern authentication for Outlook in Exchange Online"
url = "https://learn.microsoft.com/exchange/clients-and-mobile-in-exchange-online/enable-or-disable-modern-authentication-in-exchange-online"

[[check.detail.references]]
title = "Set-OrganizationConfig"
url = "https://learn.microsoft.com/powershell/module/exchange/set-organizationconfig"

[[check]]
id = "M365-EXO-002"
title = "Basic/legacy auth protocols still enabled per mailbox (POP, IMAP, SMTP AUTH, EWS, ActiveSync)"
status = "implemented"
severity = "medium"

[check.detail]
description = "One or more mailboxes have POP or IMAP enabled, or can use SMTP AUTH (the mailbox setting SmtpClientAuthenticationDisabled is false, or it is unset and the tenant allows SMTP AUTH). The finding lists those mailboxes. Counts of mailboxes with EWS and ActiveSync enabled are shown as evidence only."
impact = "POP, IMAP and SMTP AUTH are protocols commonly used by older clients and scripts, and are frequent targets for password spraying. Every mailbox that keeps them enabled adds a sign-in and mail-access path that most users do not need."
attack = [
  "Sprays common passwords against many accounts over IMAP, POP or SMTP AUTH.",
  "Downloads the mailbox of an account it signs in to over IMAP or POP.",
  "Sends phishing mail from the compromised mailbox over SMTP AUTH.",
]
remediation = [
  "Disable POP and IMAP on mailboxes that do not need them with Set-CASMailbox -PopEnabled $false -ImapEnabled $false.",
  "Disable SMTP AUTH on mailboxes with Set-CASMailbox -SmtpClientAuthenticationDisabled $true, and keep it enabled only for named devices or applications that still need it.",
  "Set the defaults for new mailboxes in the CAS mailbox plan (Set-CASMailboxPlan) so the protocols start disabled.",
  "Block legacy authentication clients with a Conditional Access policy.",
]
frameworks = [
  "CIS Microsoft 365 Foundations Benchmark",
  "NIST 800-53 CM-7",
]
verify = '''
Get-EXOCASMailbox -ResultSize Unlimited -Properties PopEnabled, ImapEnabled, SmtpClientAuthenticationDisabled |
  Where-Object { $_.PopEnabled -or $_.ImapEnabled -or $_.SmtpClientAuthenticationDisabled -eq $false } |
  Select-Object PrimarySmtpAddress, PopEnabled, ImapEnabled, SmtpClientAuthenticationDisabled'''
cvss = "AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:L/A:N"
mitre = ["T1110.003", "T1078.004"]

