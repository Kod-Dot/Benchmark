[[check]]
id = "M365-EXO-003"
title = "SMTP AUTH enabled tenant-wide"
status = "implemented"
severity = "medium"

[check.detail]
description = "SmtpClientAuthenticationDisabled is false in the transport configuration, so authenticated SMTP client submission (SMTP AUTH) is allowed for every mailbox that does not override the setting."
impact = "SMTP AUTH accepts a user name and password for sending mail. A leaked or guessed password can be used to send mail from the account, and the protocol is a common target for password spraying."
attack = [
  "Sprays common passwords against accounts over SMTP AUTH.",
  "Sends phishing or invoice fraud mail from a mailbox it signed in to, so the mail comes from a trusted internal sender.",
]
remediation = [
  "Disable SMTP AUTH for the organization with Set-TransportConfig -SmtpClientAuthenticationDisabled $true.",
  "Enable it only on the specific mailboxes that still need it (Set-CASMailbox -SmtpClientAuthenticationDisabled $false), and plan to move those devices or applications to OAuth or a connector.",
]
frameworks = [
  "CIS Microsoft 365 Foundations Benchmark",
  "NIST 800-53 CM-7",
]
verify = '''
Get-TransportConfig | Select-Object SmtpClientAuthenticationDisabled'''
cvss = "AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:N"
mitre = ["T1110.003", "T1078.004"]

