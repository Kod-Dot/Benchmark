[[check]]
id = "AD-PKI-013"
title = "ESC14: weak explicit mappings (altSecurityIdentities)"
status = "implemented"
severity = "medium"

[check.detail]
description = "A user or computer account has an explicit certificate mapping in altSecurityIdentities that does not use one of the strong forms: issuer and serial number, subject key identifier, or SHA1 hash of the public key. Weak forms map a certificate by e-mail address (RFC822), subject only, issuer only, or issuer and subject."
impact = "A domain controller signs in anyone who presents a certificate matching a weak mapping as that account. An attacker who can get a certificate with a matching e-mail or subject from any CA in NTAuth, for example by changing their own mail attribute, can sign in as the mapped account."
attack = [
  "Finds an account whose altSecurityIdentities maps by e-mail or subject.",
  "Obtains a certificate whose e-mail or subject matches, for example by setting its own mail attribute before enrolling.",
  "Signs in with that certificate as the mapped account.",
]
remediation = [
  "Replace each weak mapping with an X509:<I>issuer<SR>serial, X509:<SKI> or X509:<SHA1-PUKEY> mapping for the account's actual certificate.",
  "Remove mappings that are no longer used.",
  "Restrict who can write altSecurityIdentities and mail on privileged accounts.",
]
frameworks = [
  "NIST 800-53 IA-5",
  "NIST 800-53 IA-2",
]
verify = '''
Get-ADObject -LDAPFilter "(altSecurityIdentities=X509:*)" -Properties altSecurityIdentities |
  Where-Object { $_.altSecurityIdentities | Where-Object { $_ -notmatch '<SR>|<SKI>|<SHA1-PUKEY>' } } |
  Select-Object Name, ObjectClass, altSecurityIdentities'''
cvss = "AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:N"
mitre = ["T1649", "T1078.002", "T1098"]

