[[check]]
id = "AD-PKI-020"
title = "NTAuth store contents (unexpected CAs trusted for logon)"
status = "implemented"
severity = "high"

[check.detail]
description = "Compares the certificates in the forest's NTAuthCertificates store with the CA certificates of the enterprise CAs published under Enrollment Services. Any certificate in NTAuth that does not belong to one of those enterprise CAs is flagged, including root CAs and CAs from other forests or vendors."
impact = "Domain controllers accept sign-in certificates from every CA in NTAuth. A CA there that is not one of this forest's issuing CAs, and is not tightly controlled, can issue a certificate that signs in as any account, including Domain Admins."
attack = [
  "Compromises or gets enrollment rights on a CA that is in NTAuth but managed outside the forest's Tier 0.",
  "Obtains a certificate from it naming a Domain Admin.",
  "Uses the certificate to request a Kerberos ticket (PKINIT) as that Domain Admin.",
]
remediation = [
  "Review each flagged certificate and remove it from NTAuth if the CA should not issue logon certificates (certutil -viewdelstore on the NTAuth store, run by an Enterprise Admin).",
  "Keep only the forest's issuing CAs in NTAuth; root CAs should not be in it.",
  "Manage any third-party CA that must stay in NTAuth as a Tier 0 asset.",
]
frameworks = [
  "NIST 800-53 IA-5",
  "NIST 800-53 AC-6",
]
verify = '''
Get-ADObject "CN=NTAuthCertificates,CN=Public Key Services,CN=Services,$((Get-ADRootDSE).configurationNamingContext)" -Properties cACertificate |
  ForEach-Object { $_.cACertificate | ForEach-Object { [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($_) } } |
  Select-Object Subject, Issuer, Thumbprint, NotAfter'''
cvss = "AV:N/AC:H/PR:L/UI:N/S:C/C:H/I:H/A:H"
mitre = ["T1649", "T1556", "T1078.002"]

