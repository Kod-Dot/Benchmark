[[check]]
id = "AD-PKI-011"
title = "ESC11: RPC enrollment without packet privacy (IF_ENFORCEENCRYPTICERTREQUEST)"
status = "implemented"
severity = "high"

[check.detail]
description = "A CA does not require encrypted RPC certificate requests (IF_ENFORCEENCRYPTICERTREQUEST off in InterfaceFlags) (ESC11)."
impact = "NTLM authentication can be relayed to the CA's RPC interface to request certificates as the victim."
remediation = [
  "certutil -setreg CA\\InterfaceFlags +IF_ENFORCEENCRYPTICERTREQUEST, then restart Certificate Services.",
]
verify = "certutil -getreg CA\\InterfaceFlags"
mitre = ["T1557.001", "T1649"]

[[check]]
id = "AD-PKI-012"
title = "ESC13: issuance policy linked to groups"
status = "implemented"
severity = "high"

[check.detail]
description = "A certificate template published on an enterprise CA carries an issuance policy whose OID object is linked to a group through msDS-OIDToGroupLink, and principals other than admins and Tier 0 can enroll. When someone signs in with a certificate carrying that policy, the domain controller adds the linked group to their Kerberos token."
impact = "Every principal who can enroll on the template gets the rights of the linked group when they sign in with the certificate, without being a member of it. If the group holds privileged rights, this is a hidden path to those privileges that group membership reviews do not show."
attack = [
  "Signs in as a user who can enroll and requests a certificate on the template.",
  "Uses the certificate to request a Kerberos ticket (PKINIT); the ticket includes the linked group.",
  "Uses the group's rights, for example to administer servers or change directory objects.",
]
remediation = [
  "Remove the msDS-OIDToGroupLink value from the issuance policy object if the link is not needed.",
  "If the link is needed, restrict Enroll on the template to the users who should hold the group's rights, and require manager approval.",
  "Make sure the linked group holds no more rights than the certificate holders need.",
]
frameworks = [
  "NIST 800-53 AC-6",
  "NIST 800-53 AC-2",
]
verify = '''
Get-ADObject -SearchBase "CN=OID,CN=Public Key Services,CN=Services,$((Get-ADRootDSE).configurationNamingContext)" -LDAPFilter "(msDS-OIDToGroupLink=*)" -Properties msPKI-Cert-Template-OID, msDS-OIDToGroupLink |
  Select-Object DisplayName, msPKI-Cert-Template-OID, msDS-OIDToGroupLink'''
cvss = "AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H"
mitre = ["T1649", "T1078.002"]

