[[check]]
id = "AD-PKI-021"
title = "Root CA online (should be offline)"
status = "implemented"
severity = "medium"

[check.detail]
description = "An enterprise CA published under Enrollment Services has a self-signed CA certificate, which means the forest's root CA is online and issuing certificates directly."
impact = "The root CA's private key sits on a networked, domain-joined server. If that server is compromised, the root key cannot be revoked by anything above it; every certificate in the hierarchy must be reissued under a new root."
attack = [
  "Compromises the domain-joined server that runs the root CA.",
  "Extracts the root CA's private key.",
  "Forges certificates, including sign-in certificates for any account, that every client trusts.",
]
remediation = [
  "Build a two-tier hierarchy: an offline, non-domain-joined root CA and one or more online enterprise subordinate CAs.",
  "Move issuance to the subordinate CAs, then take the root offline and use it only to sign subordinate certificates and CRLs.",
  "Protect the root key with a hardware security module where possible.",
]
frameworks = [
  "NIST 800-53 SC-12",
]
verify = '''
Get-ADObject -SearchBase "CN=Enrollment Services,CN=Public Key Services,CN=Services,$((Get-ADRootDSE).configurationNamingContext)" -Filter * -Properties cACertificate |
  ForEach-Object { $_.cACertificate | ForEach-Object { [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($_) } } |
  Select-Object Subject, Issuer, @{n='SelfSigned';e={$_.Subject -eq $_.Issuer}}'''
mitre = ["T1649"]

