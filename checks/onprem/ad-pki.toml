[[check]]
id = "AD-PKI-015"
title = "ESC16: CA-wide security extension disabled"
status = "implemented"
severity = "high"

[check.detail]
description = "A CA disables the szOID_NTDS_CA_SECURITY_EXT (1.3.6.1.4.1.311.25.2) extension CA-wide (ESC16)."
impact = "Without the SID extension, certificates map to accounts only by name, which re-opens the attacks the 2022 strong-mapping updates closed."
remediation = [
  "Remove 1.3.6.1.4.1.311.25.2 from the policy module's DisableExtensionList and restart Certificate Services.",
]
verify = "certutil -getreg policy\\DisableExtensionList"
mitre = ["T1649"]

[[check]]
id = "AD-PKI-016"
title = "CA certificate key length and hash algorithm"
status = "implemented"
severity = "medium"

[check.detail]
description = "Reads the CA certificates published on each enterprise CA object and flags any that use an RSA key shorter than 2048 bits or a signature made with MD5 or SHA-1."
impact = "A short RSA key or a weak signature hash makes it more feasible to forge certificates that chain to the CA. Modern clients and services also increasingly reject SHA-1 signed chains, which can break authentication."
attack = [
  "Reads the CA certificate from the directory.",
  "Targets the weak key or hash to forge a certificate that chains to the CA.",
  "Signs in or impersonates a service with the forged certificate.",
]
remediation = [
  "Renew the CA certificate with a new RSA key of at least 2048 bits (3072 or 4096 for a root) or an ECC key, and SHA-256 or stronger as the signature hash.",
  "Update CAPolicy.inf and the CA's CSP settings before renewing so the new key and hash are used.",
  "Publish the renewed certificate to NTAuth, AIA and the trusted roots, then retire the old one.",
]
frameworks = [
  "NIST 800-53 SC-12",
  "NIST 800-53 SC-13",
]
verify = '''
Get-ADObject -SearchBase "CN=Enrollment Services,CN=Public Key Services,CN=Services,$((Get-ADRootDSE).configurationNamingContext)" -Filter * -Properties cACertificate |
  ForEach-Object { $_.cACertificate | ForEach-Object { [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($_) } } |
  Select-Object Subject, @{n='Key';e={$_.PublicKey.Oid.FriendlyName}}, @{n='Bits';e={$_.PublicKey.Key.KeySize}}, @{n='Signature';e={$_.SignatureAlgorithm.FriendlyName}}'''
mitre = ["T1649"]

