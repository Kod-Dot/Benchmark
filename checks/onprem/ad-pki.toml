[[check]]
id = "AD-PKI-014"
title = "ESC15 / EKUwu: schema v1 templates with enrollee-supplied subject"
status = "implemented"
severity = "high"

[check.detail]
description = "A schema version 1 certificate template published on an enterprise CA lets the requester supply the subject, and principals other than admins and Tier 0 can enroll. On a CA without the November 2024 update (CVE-2024-49019), a requester can add application policies, such as Client Authentication, to a request on a version 1 template, and the CA copies them into the certificate."
impact = "On an unpatched CA, an enrollee can request a certificate for any account with Client Authentication added, even when the template's own usage is only server authentication, and sign in as that account. The default WebServer template is a common example."
attack = [
  "Signs in as a user who can enroll on the version 1 template.",
  "Requests a certificate with a Domain Admin's name as subject and Client Authentication added as an application policy.",
  "Uses the certificate to sign in as that Domain Admin.",
]
remediation = [
  "Install the November 2024 security update (CVE-2024-49019) on every CA.",
  "Duplicate the template to a newer schema version and retire the version 1 template, or select Build from this Active Directory information on it.",
  "Remove Enroll on the template for broad groups such as Domain Users and Authenticated Users.",
]
frameworks = [
  "NIST 800-53 SI-2",
  "NIST 800-53 AC-6",
]
verify = '''
Get-ADObject -SearchBase "CN=Certificate Templates,CN=Public Key Services,CN=Services,$((Get-ADRootDSE).configurationNamingContext)" -Filter * -Properties msPKI-Template-Schema-Version, msPKI-Certificate-Name-Flag |
  Where-Object { $_.'msPKI-Template-Schema-Version' -le 1 -and $_.'msPKI-Certificate-Name-Flag' -band 1 } | Select-Object Name'''
cvss = "AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H"
mitre = ["T1649", "T1078.002", "T1550"]

