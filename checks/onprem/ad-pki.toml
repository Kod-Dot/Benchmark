[[check]]
id = "AD-PKI-005"
title = "ESC4: Certificate templates writable by non-admins"
status = "implemented"
severity = "high"

[check.detail]
description = "A certificate template can be changed by a principal other than admins and Tier 0: the principal owns the template, or has full control, permission to modify permissions, permission to take ownership, or write access to all or some of its properties. All templates are checked, published or not."
impact = "A principal who can change a template can turn it into an ESC1 template: let the enrollee supply the subject, add client authentication, remove approval and grant themselves Enroll. They then request a certificate as a Domain Admin. An unpublished template is only one step from use, since publishing it needs a CA admin."
attack = [
  "Finds a template on which a controlled account has write rights.",
  "Changes the template to allow an enrollee-supplied subject with client authentication and grants itself Enroll.",
  "Requests a certificate as a Domain Admin and signs in with it, then restores the template.",
]
remediation = [
  "On each flagged template's Security tab, remove Full Control, Write, and Modify permissions for everyone except PKI admins.",
  "Set the owner of each template to Enterprise Admins or a dedicated PKI admin group.",
  "Monitor changes to certificate template objects in the directory service change audit log.",
]
frameworks = [
  "NIST 800-53 AC-6",
  "NIST 800-53 AC-3",
]
verify = '''
$base = "CN=Certificate Templates,CN=Public Key Services,CN=Services,$((Get-ADRootDSE).configurationNamingContext)"
Get-ADObject -SearchBase $base -Filter * -Properties nTSecurityDescriptor | ForEach-Object {
  $t = $_.Name
  $_.nTSecurityDescriptor.Access | Where-Object { $_.AccessControlType -eq 'Allow' -and $_.ActiveDirectoryRights -match 'GenericAll|GenericWrite|WriteDacl|WriteOwner|WriteProperty' } |
    Select-Object @{n='Template';e={$t}}, IdentityReference, ActiveDirectoryRights
}'''
cvss = "AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H"
mitre = ["T1649", "T1078.002"]

[[check.detail.references]]
title = "MITRE ATT&CK T1649: Steal or Forge Authentication Certificates"
url = "https://attack.mitre.org/techniques/T1649/"

[[check.detail.references]]
title = "Certified Pre-Owned: Abusing Active Directory Certificate Services (SpecterOps, 2021)"
url = "https://specterops.io/wp-content/uploads/sites/3/2022/06/Certified_Pre-Owned.pdf"

[[check]]
id = "AD-PKI-006"
title = "ESC5: Writable PKI objects (CA objects, NTAuth, AIA, CDP and other Public Key Services containers)"
status = "implemented"
severity = "high"

[check.detail]
description = "An object under CN=Public Key Services in the configuration partition, other than a certificate template or an issuance policy object, can be changed by a principal other than admins and Tier 0. This covers the enterprise CA objects, the NTAuthCertificates store, and the AIA, CDP, Certification Authorities and Enrollment Services containers. The principal owns the object, or has full control, permission to modify permissions, permission to take ownership, or write access to its properties. The CA host's computer object and the CA's own registry are not read."
impact = "Write access to these objects lets an attacker add a rogue CA to the NTAuth store or to the trusted roots, publish templates on a CA, or redirect where certificates and revocation lists are fetched. Adding a CA they control to NTAuth lets them forge a sign-in certificate for any account."
attack = [
  "Finds a PKI object on which a controlled account has write rights.",
  "Adds a certificate for a CA it controls to the NTAuthCertificates store, or changes an enterprise CA object's published templates.",
  "Forges or requests a certificate for a Domain Admin and signs in with it.",
]
remediation = [
  "On each flagged object, remove write, Modify permissions and Take ownership rights for everyone except PKI admins (use ADSI Edit on the configuration partition).",
  "Set the owner of each object to Enterprise Admins.",
  "Audit changes to objects under CN=Public Key Services.",
]
frameworks = [
  "NIST 800-53 AC-6",
  "NIST 800-53 AC-3",
]
verify = '''
$base = "CN=Public Key Services,CN=Services,$((Get-ADRootDSE).configurationNamingContext)"
Get-ADObject -SearchBase $base -Filter { objectClass -ne 'pKICertificateTemplate' -and objectClass -ne 'msPKI-Enterprise-Oid' } -Properties nTSecurityDescriptor | ForEach-Object {
  $o = $_.DistinguishedName
  $_.nTSecurityDescriptor.Access | Where-Object { $_.AccessControlType -eq 'Allow' -and $_.ActiveDirectoryRights -match 'GenericAll|GenericWrite|WriteDacl|WriteOwner|WriteProperty' } |
    Select-Object @{n='Object';e={$o}}, IdentityReference, ActiveDirectoryRights
}'''
cvss = "AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H"
mitre = ["T1649", "T1556"]

