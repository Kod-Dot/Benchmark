[[check]]
id = "AD-PKI-007"
title = "ESC6: EDITF_ATTRIBUTESUBJECTALTNAME2 on CA"
status = "implemented"
severity = "critical"

[check.detail]
description = "A CA has EDITF_ATTRIBUTESUBJECTALTNAME2 set in its policy module, so it puts subject alternative names from request attributes into certificates (ESC6)."
impact = "Any user who can enroll in a template that allows client authentication can request a certificate for any account, including a domain admin, and sign in as it."
remediation = [
  "Turn the flag off: certutil -setreg policy\\EditFlags -EDITF_ATTRIBUTESUBJECTALTNAME2, then restart Certificate Services.",
  "Apply the May 2022 updates and full certificate mapping enforcement on DCs.",
]
verify = "certutil -getreg policy\\EditFlags"
cvss = "AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H"
mitre = ["T1649"]

[[check.detail.references]]
title = "Certified Pre-Owned (SpecterOps)"
url = "https://specterops.io/wp-content/uploads/sites/3/2022/06/Certified_Pre-Owned.pdf"

[[check]]
id = "AD-PKI-008"
title = "ESC7: ManageCA / ManageCertificates held by low-priv users"
status = "implemented"
severity = "critical"

[check.detail]
description = "Principals outside Tier 0 hold ManageCA (CA administrator) or ManageCertificates (certificate manager) on a CA (ESC7)."
impact = "ManageCA can turn on ESC6 or add officers; ManageCertificates can approve pending requests, including ones for privileged accounts. Both lead to domain compromise."
remediation = [
  "Remove the rights from the CA's Security tab, leaving only Tier 0 groups.",
  "Review who can manage the CA server itself.",
]
verify = "certutil -getreg CA\\Security"
cvss = "AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H"
mitre = ["T1649"]

[[check.detail.references]]
title = "Certified Pre-Owned (SpecterOps)"
url = "https://specterops.io/wp-content/uploads/sites/3/2022/06/Certified_Pre-Owned.pdf"

[[check]]
id = "AD-PKI-009"
title = "ESC8: Web enrollment (HTTP) endpoints exposed to NTLM relay"
status = "implemented"
severity = "high"

[check.detail]
description = "AD CS web enrollment is installed and served over HTTP, or without Extended Protection for Authentication (ESC8)."
impact = "An attacker can coerce a DC or server to authenticate and relay that NTLM authentication to web enrollment, getting a certificate as the machine and with it control of it."
remediation = [
  "Remove web enrollment if it is not needed.",
  "Otherwise serve it over HTTPS only, require Extended Protection for Authentication and turn off NTLM for it.",
]
verify = "Get-WebBinding -Name 'Default Web Site'; Get-WebConfigurationProperty -PSPath 'IIS:\\' -Location 'Default Web Site/CertSrv' -Filter system.webServer/security/authentication/windowsAuthentication/extendedProtection -Name tokenChecking"
cvss = "AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H"
mitre = ["T1557.001", "T1649"]

[[check.detail.references]]
title = "Certified Pre-Owned (SpecterOps)"
url = "https://specterops.io/wp-content/uploads/sites/3/2022/06/Certified_Pre-Owned.pdf"

[[check]]
id = "AD-PKI-010"
title = "ESC9: authentication templates without the SID security extension"
status = "implemented"
severity = "high"

[check.detail]
description = "A certificate template published on an enterprise CA issues certificates that can be used to sign in, has the CT_FLAG_NO_SECURITY_EXTENSION flag set, and principals other than admins and Tier 0 can enroll. Certificates from this template do not carry the requester's SID, so a domain controller falls back to mapping them by UPN or DNS name. The domain controllers' StrongCertificateBindingEnforcement and CertificateMappingMethods registry settings (ESC10) are not read."
impact = "An attacker who can change the UPN of one account sets it to a Domain Admin's name, enrolls on the template as that account, and restores the UPN. Without the SID extension, the certificate then maps to the Domain Admin. Domain controllers in full enforcement mode reject such certificates."
attack = [
  "Uses write access on an account to set its UPN to a Domain Admin's sAMAccountName.",
  "Enrolls on the template as that account; the certificate carries the Domain Admin's name and no SID.",
  "Restores the UPN and signs in with the certificate as the Domain Admin.",
]
remediation = [
  "Clear CT_FLAG_NO_SECURITY_EXTENSION (0x80000) from msPKI-Enrollment-Flag on each flagged template, unless an application is known to need it.",
  "Put all domain controllers in full enforcement mode for strong certificate binding (StrongCertificateBindingEnforcement = 2), as described in KB5014754.",
  "Remove Enroll on the template for broad groups.",
]
frameworks = [
  "NIST 800-53 IA-5",
  "NIST 800-53 AC-6",
]
verify = '''
Get-ADObject -SearchBase "CN=Certificate Templates,CN=Public Key Services,CN=Services,$((Get-ADRootDSE).configurationNamingContext)" -Filter * -Properties msPKI-Enrollment-Flag |
  Where-Object { $_.'msPKI-Enrollment-Flag' -band 0x80000 } | Select-Object Name, msPKI-Enrollment-Flag'''
cvss = "AV:N/AC:H/PR:L/UI:N/S:C/C:H/I:H/A:H"
mitre = ["T1649", "T1078.002", "T1550"]

