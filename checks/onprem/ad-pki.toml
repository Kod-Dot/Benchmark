[[check]]
id = "AD-PKI-017"
title = "CA certificate expiry"
status = "implemented"
severity = "medium"

[check.detail]
description = "Reads the CA certificates published on each enterprise CA object and flags any that have expired or expire within 180 days. CRL publication is not checked, since it needs the CA or its CDP locations."
impact = "When a CA certificate expires, certificates it issued stop chaining to a valid CA. Smart card and certificate sign-in, TLS and other services that rely on them fail. A CA cannot issue certificates that outlive its own certificate, so issued certificates also get shorter as expiry nears."
attack = [
  "No direct attack; an expired or expiring CA certificate causes an outage of certificate-based services.",
  "During an unplanned renewal, rushed changes to CA settings and templates can introduce weak configuration.",
]
remediation = [
  "Renew each flagged CA certificate well before it expires, from the Certification Authority console (All Tasks, Renew CA Certificate).",
  "Publish the renewed certificate to NTAuth, AIA and the trusted roots.",
  "Decommission CA objects whose certificate has expired and that no longer issue certificates.",
]
frameworks = [
  "NIST 800-53 SC-12",
]
verify = '''
Get-ADObject -SearchBase "CN=Enrollment Services,CN=Public Key Services,CN=Services,$((Get-ADRootDSE).configurationNamingContext)" -Filter * -Properties cACertificate |
  ForEach-Object { $_.cACertificate | ForEach-Object { [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($_) } } |
  Select-Object Subject, NotAfter'''
mitre = ["T1649"]

