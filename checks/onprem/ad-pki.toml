[[check]]
id = "AD-PKI-018"
title = "Sensitive templates with enrollee-supplied subject and no approval"
status = "implemented"
severity = "medium"

[check.detail]
description = "A certificate template published on an enterprise CA issues sign-in certificates (Client Authentication, PKINIT, Smart Card Logon, Any Purpose or no usage restriction) or Certificate Request Agent certificates, lets the requester supply the subject, and requires neither CA manager approval nor an authorized signature. Unlike ESC1, this check does not look at who can enroll, so it also flags templates that only admins can use today."
impact = "Nothing but the template's enrollment permissions stands between a requester and a certificate for any account. One permission mistake, or one compromised account with Enroll, turns the template into ESC1."
attack = [
  "Gains control of any account that can enroll on the template.",
  "Requests a certificate with a Domain Admin's name in the subject.",
  "Signs in with the certificate as that Domain Admin.",
]
remediation = [
  "On the template's Issuance Requirements tab, select CA certificate manager approval, or require an authorized signature.",
  "If the subject does not need to come from the request, select Build from this Active Directory information on the Subject Name tab.",
  "Keep Enroll on the template limited to a small, named group.",
]
frameworks = [
  "NIST 800-53 AC-6",
  "NIST 800-53 IA-5",
]
verify = '''
Get-ADObject -SearchBase "CN=Certificate Templates,CN=Public Key Services,CN=Services,$((Get-ADRootDSE).configurationNamingContext)" -Filter * -Properties msPKI-Certificate-Name-Flag, msPKI-Enrollment-Flag, msPKI-RA-Signature, pKIExtendedKeyUsage |
  Where-Object { ($_.'msPKI-Certificate-Name-Flag' -band 1) -and -not ($_.'msPKI-Enrollment-Flag' -band 2) -and -not $_.'msPKI-RA-Signature' } |
  Select-Object Name, pKIExtendedKeyUsage'''
cvss = "AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:H"
mitre = ["T1649", "T1078.002"]

