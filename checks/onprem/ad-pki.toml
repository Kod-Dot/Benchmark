[[check]]
id = "AD-PKI-019"
title = "Templates with very long validity"
status = "implemented"
severity = "low"

[check.detail]
description = "A certificate template published on an enterprise CA issues certificates valid for more than two years, read from its pKIExpirationPeriod attribute."
impact = "A long-lived certificate keeps working for its whole lifetime. If one is stolen or wrongly issued, it gives the holder persistent access, including after password resets, until it expires or is revoked and the revocation is checked."
attack = [
  "Steals or wrongly obtains a certificate issued from the template.",
  "Keeps signing in with it for years, even after the account's password changes.",
]
remediation = [
  "On the template's General tab, reduce the validity period to the shortest that fits its use; one year or less for user and computer authentication.",
  "Use autoenrollment so certificates renew automatically before they expire.",
  "Revoke certificates that are no longer needed.",
]
frameworks = [
  "NIST 800-53 IA-5",
  "NIST 800-53 SC-12",
]
verify = '''
Get-ADObject -SearchBase "CN=Certificate Templates,CN=Public Key Services,CN=Services,$((Get-ADRootDSE).configurationNamingContext)" -Filter * -Properties pKIExpirationPeriod |
  Select-Object Name, @{n='ValidityDays';e={ [math]::Abs([BitConverter]::ToInt64($_.pKIExpirationPeriod, 0)) / 864000000000 }}'''
mitre = ["T1649", "T1078.002"]

