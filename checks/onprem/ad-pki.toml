# AD-PKI: AD Certificate Services

area = "AD-PKI"

[[check]]
id = "AD-PKI-001"
title = "Enterprise CAs inventory and operating system support"
status = "implemented"
severity = "medium"

[check.detail]
description = "Lists every enterprise CA published under Enrollment Services, with its host name and the expiry date of its CA certificate. The operating system is read from the operatingSystem attribute of the CA's computer object. A CA whose computer object reports Windows Server 2003, 2008 or 2012 is flagged as out of support. Patch level and installed updates are not read."
impact = "A CA on an unsupported Windows Server version no longer receives security updates, including fixes for AD CS flaws. Whoever takes control of a CA host can use its private key to issue certificates that sign in as any account in the forest."
attack = [
  "Finds the enterprise CA hosts in the Enrollment Services container.",
  "Exploits a vulnerability that is no longer patched on the CA's operating system.",
  "Uses the CA's private key to issue a sign-in certificate for a Domain Admin.",
]
remediation = [
  "Migrate each flagged CA to a supported Windows Server version.",
  "Until then, treat the CA host as Tier 0: restrict who can sign in to it and isolate it on the network.",
  "Remove Enrollment Services objects for CAs that have been decommissioned so the inventory stays accurate.",
]
frameworks = [
  "NIST 800-53 SI-2",
  "NIST 800-53 CM-8",
]
verify = '''
$cfg = (Get-ADRootDSE).configurationNamingContext
Get-ADObject -SearchBase "CN=Enrollment Services,CN=Public Key Services,CN=Services,$cfg" -Filter * -Properties dNSHostName |
  Where-Object dNSHostName | ForEach-Object { Get-ADComputer -Filter "dNSHostName -eq '$($_.dNSHostName)'" -Properties operatingSystem } |
  Select-Object Name, dNSHostName, operatingSystem'''
mitre = ["T1649", "T1068"]

[[check.detail.references]]
title = "MITRE ATT&CK T1649: Steal or Forge Authentication Certificates"
url = "https://attack.mitre.org/techniques/T1649/"

[[check.detail.references]]
title = "MITRE ATT&CK T1068: Exploitation for Privilege Escalation"
url = "https://attack.mitre.org/techniques/T1068/"

[[check]]
id = "AD-PKI-002"
title = "ESC1: templates allowing enrollee-supplied subject with client auth EKU and low-priv enrollment"
status = "implemented"
severity = "critical"

[check.detail]
description = "A certificate template published on an enterprise CA lets the requester write any name into the subject, the certificates it issues can be used to sign in (Client Authentication, PKINIT, Smart Card Logon, Any Purpose or no usage restriction), and principals other than admins and Tier 0 can enroll without manager approval or an authorized signature. A domain controller maps such a certificate to the account it names, so the template issues sign-in certificates for any account."
impact = "Any principal with Enroll can request a certificate in the name of a Domain Admin and sign in as that admin. The certificate stays valid for its lifetime even after the admin changes their password."
attack = [
  "Signs in as any user who can enroll and lists the templates they can use.",
  "Requests a certificate on the template with a Domain Admin's UPN in the subject alternative name.",
  "Uses the certificate to request a Kerberos ticket (PKINIT) as that Domain Admin.",
]
remediation = [
  "In the Certificate Templates console, open the template, Subject Name tab, and select Build from this Active Directory information.",
  "On the Security tab, remove Enroll for broad groups such as Domain Users and Authenticated Users; grant it only to the group that needs the template.",
  "If the template is unused, remove it from every CA instead.",
  "Revoke certificates already issued from the template whose subject does not match the requester.",
]
frameworks = [
  "ANSSI vuln1_adcs_template_auth_enroll_with_name",
  "NIST 800-53 AC-6",
]
verify = '''
Get-ADObject -SearchBase "CN=Certificate Templates,CN=Public Key Services,CN=Services,$((Get-ADRootDSE).configurationNamingContext)" -Filter * -Properties msPKI-Certificate-Name-Flag |
  Where-Object { $_.'msPKI-Certificate-Name-Flag' -band 1 } | Select-Object Name'''
cvss = "AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H"
mitre = ["T1649", "T1078.002", "T1550"]

[[check.detail.references]]
