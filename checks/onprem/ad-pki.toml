[[check]]
id = "AD-PKI-022"
title = "CA backup and private key protection (HSM) inventory"
status = "implemented"
severity = "medium"

[check.detail]
description = "A CA's private key is held by a software key storage provider rather than a hardware security module (HSM)."
impact = "Anyone with admin rights on the CA server can export a software key and forge certificates for any account indefinitely."
remediation = [
  "Move the CA key to an HSM when the CA is renewed or rebuilt.",
  "Until then, treat the CA server and its backups as Tier 0.",
]
verify = "certutil -getreg CA\\CSP\\Provider"
mitre = ["T1649", "T1552"]

[[check]]
id = "AD-PKI-023"
title = "Auditing enabled on CAs"
status = "implemented"
severity = "medium"

[check.detail]
description = "A CA does not audit every event category (AuditFilter below 127)."
impact = "Without full CA auditing, certificate requests, approvals and configuration changes made during an attack leave no record."
remediation = [
  "certutil -setreg CA\\AuditFilter 127, restart Certificate Services, and turn on Audit Certification Services.",
]
verify = "certutil -getreg CA\\AuditFilter"
mitre = ["T1562.002"]

[[check]]
id = "AD-PKI-024"
title = "Published but unused templates"
status = "implemented"
severity = "low"

[check.detail]
description = "Templates a CA publishes that it did not issue any certificate from in the last 90 days."
impact = "Every published template is attack surface: one that is misconfigured or later changed can be abused even though nobody needs it."
remediation = [
  "Stop publishing templates that are not used.",
]
verify = "certutil -catemplates; certutil -view -restrict \"NotBefore>=<date>\" -out CertificateTemplate"
mitre = ["T1649"]
