[[check]]
id = "AD-PKI-003"
title = "ESC2: Any Purpose / no EKU templates enrollable by low-priv users"
status = "implemented"
severity = "critical"

[check.detail]
description = "A certificate template published on an enterprise CA issues certificates with the Any Purpose usage or with no usage restriction at all, and principals other than admins and Tier 0 can enroll without manager approval or an authorized signature. Such a certificate is accepted for client authentication and can also act as an enrollment agent certificate."
impact = "An enrollee can use the certificate to sign in, and can use it as an enrollment agent to request certificates on behalf of other users, including Domain Admins. A certificate with no usage restriction can also be used as a subordinate CA certificate in some trust paths."
attack = [
  "Signs in as any user who can enroll and requests a certificate on the template.",
  "Uses the certificate as an enrollment agent to request a certificate on behalf of a Domain Admin.",
  "Uses that certificate to request a Kerberos ticket (PKINIT) as the Domain Admin.",
]
remediation = [
  "In the Certificate Templates console, open the template, Extensions tab, and replace Any Purpose or the empty usage list with only the usages the template needs.",
  "On the Security tab, remove Enroll for broad groups such as Domain Users and Authenticated Users.",
  "If the template is unused, remove it from every CA.",
]
frameworks = [
  "NIST 800-53 AC-6",
  "NIST 800-53 IA-5",
]
verify = '''
Get-ADObject -SearchBase "CN=Certificate Templates,CN=Public Key Services,CN=Services,$((Get-ADRootDSE).configurationNamingContext)" -Filter * -Properties pKIExtendedKeyUsage, msPKI-Certificate-Application-Policy |
  Where-Object { -not $_.pKIExtendedKeyUsage -or $_.pKIExtendedKeyUsage -contains '2.5.29.37.0' } |
  Select-Object Name, pKIExtendedKeyUsage, msPKI-Certificate-Application-Policy'''
cvss = "AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H"
mitre = ["T1649", "T1078.002", "T1550"]

[[check.detail.references]]
title = "MITRE ATT&CK T1649: Steal or Forge Authentication Certificates"
url = "https://attack.mitre.org/techniques/T1649/"

[[check.detail.references]]
title = "Certified Pre-Owned: Abusing Active Directory Certificate Services (SpecterOps, 2021)"
url = "https://specterops.io/wp-content/uploads/sites/3/2022/06/Certified_Pre-Owned.pdf"

[[check]]
id = "AD-PKI-004"
title = "ESC3: Enrollment agent templates"
status = "implemented"
severity = "high"

[check.detail]
description = "A certificate template published on an enterprise CA issues Certificate Request Agent certificates, and principals other than admins and Tier 0 can enroll without manager approval or an authorized signature. A Certificate Request Agent certificate lets its holder request certificates on behalf of other users."
impact = "An enrollee gets an enrollment agent certificate and uses it to request a sign-in certificate for a Domain Admin on any template that accepts enrollment agents, such as the default User template. Unless the CA restricts enrollment agents, this gives full control of the domain."
attack = [
  "Signs in as any user who can enroll and requests a Certificate Request Agent certificate on the template.",
  "Uses it to co-sign a request on behalf of a Domain Admin on an authentication template.",
  "Uses the resulting certificate to request a Kerberos ticket (PKINIT) as that Domain Admin.",
]
remediation = [
  "On the template's Security tab, grant Enroll only to the named enrollment agents who need it.",
  "On the Issuance Requirements tab, require CA certificate manager approval.",
  "On each CA, configure restricted enrollment agents so agents can enroll only for specific users and templates.",
  "If the template is unused, remove it from every CA.",
]
frameworks = [
  "NIST 800-53 AC-6",
  "NIST 800-53 IA-5",
]
verify = '''
Get-ADObject -SearchBase "CN=Certificate Templates,CN=Public Key Services,CN=Services,$((Get-ADRootDSE).configurationNamingContext)" -Filter * -Properties pKIExtendedKeyUsage, msPKI-Certificate-Application-Policy, msPKI-Enrollment-Flag, msPKI-RA-Signature |
  Where-Object { $_.pKIExtendedKeyUsage -contains '1.3.6.1.4.1.311.20.2.1' -or $_.'msPKI-Certificate-Application-Policy' -contains '1.3.6.1.4.1.311.20.2.1' } |
  Select-Object Name, msPKI-Enrollment-Flag, msPKI-RA-Signature'''
cvss = "AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H"
mitre = ["T1649", "T1078.002", "T1550"]

