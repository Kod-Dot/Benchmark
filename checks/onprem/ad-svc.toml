[[check]]
id = "AD-SVC-007"
title = "Service accounts with SPNs and RC4 enabled"
status = "implemented"
severity = "medium"

[check.detail]
description = "An enabled user account with a service principal name (krbtgt excluded) allows RC4 for Kerberos: msDS-SupportedEncryptionTypes is not set (tickets for it then default to RC4), allows RC4 only, or allows RC4 alongside AES."
impact = "A service ticket encrypted with RC4 is derived from the account's NT hash and can be cracked offline far faster than an AES ticket. Accounts that allow RC4 are the easiest Kerberoasting targets."
attack = [
  "Signs in as any domain user and requests an RC4 service ticket for the account's SPN.",
  "Cracks the ticket offline to recover the service account's password.",
  "Signs in as the service account wherever it has rights.",
]
remediation = [
  "Set msDS-SupportedEncryptionTypes on each listed account to AES only (0x18), after confirming the service and its clients support AES.",
  "Change the account's password after enabling AES so that AES keys exist.",
  "Prefer moving the service to a gMSA.",
]
frameworks = [
  "NIST 800-53 SC-13",
  "NIST 800-53 IA-5",
]
verify = '''
Get-ADUser -LDAPFilter '(&(servicePrincipalName=*)(!(userAccountControl:1.2.840.113556.1.4.803:=2)))' -Properties msDS-SupportedEncryptionTypes |
  Where-Object { $_.SamAccountName -ne 'krbtgt' -and (-not $_.'msDS-SupportedEncryptionTypes' -or ($_.'msDS-SupportedEncryptionTypes' -band 4)) } |
  Select-Object Name, msDS-SupportedEncryptionTypes'''
cvss = "AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:N"
mitre = ["T1558.003"]

[[check.detail.references]]
title = "Detect and remediate RC4 usage in Kerberos"
url = "https://learn.microsoft.com/windows-server/security/kerberos/detect-remediate-rc4-kerberos"

[[check.detail.references]]
title = "MITRE ATT&CK T1558.003: Kerberoasting"
url = "https://attack.mitre.org/techniques/T1558/003/"

[[check]]
id = "AD-SVC-008"
title = "Service accounts in privileged groups"
status = "implemented"
severity = "high"

[check.detail]
description = "An enabled user account with a service principal name (krbtgt excluded) is a direct or nested member of an admin group: Domain Admins, Enterprise Admins, Schema Admins, Key Admins, Enterprise Key Admins, Administrators, Account Operators, Server Operators, Print Operators, Backup Operators or DnsAdmins."
impact = "Any domain user can request a ticket for the account's SPN and crack its password offline. Cracking it gives admin rights on the domain directly, without any other step."
attack = [
  "Signs in as any domain user and lists accounts with SPNs in admin groups.",
  "Requests a service ticket for the account and cracks it offline (Kerberoasting).",
  "Signs in as the service account with its admin rights.",
]
remediation = [
  "Remove the service account from admin groups and grant only the rights the service needs on the systems it runs on.",
  "If it must stay privileged, move it to a gMSA or give it a long random password, and allow only AES for it.",
  "Remove SPNs from accounts that no longer run a service.",
]
frameworks = [
  "ANSSI vuln1_spn_priv",
  "NIST 800-53 AC-6",
]
verify = '''
'Domain Admins', 'Enterprise Admins', 'Schema Admins', 'Administrators', 'Account Operators', 'Backup Operators' |
  ForEach-Object { Get-ADGroupMember $_ -Recursive } | Where-Object objectClass -eq 'user' |
  Sort-Object distinguishedName -Unique | Get-ADUser -Properties servicePrincipalName |
  Where-Object { $_.Enabled -and $_.servicePrincipalName -and $_.SamAccountName -ne 'krbtgt' } |
  Select-Object Name, servicePrincipalName'''
cvss = "AV:N/AC:H/PR:L/UI:N/S:C/C:H/I:H/A:H"
mitre = ["T1558.003", "T1078.002"]

[[check.detail.references]]
title = "MITRE ATT&CK T1558.003: Kerberoasting"
url = "https://attack.mitre.org/techniques/T1558/003/"

[[check.detail.references]]
title = "Implementing least-privilege administrative models"
url = "https://learn.microsoft.com/windows-server/identity/ad-ds/plan/security-best-practices/implementing-least-privilege-administrative-models"

[[check]]
id = "AD-SVC-009"
title = "Standalone managed service accounts not linked to a computer"
status = "implemented"
severity = "low"

[check.detail]
description = "Counts the standalone managed service accounts (sMSAs, class msDS-ManagedServiceAccount) and flags each one that is not linked to any computer (msDS-HostServiceAccountBL is empty). An sMSA is used on exactly one computer; one without a link is unused or its host was removed."
impact = "Unused service accounts stay enabled with whatever rights they were given. Nobody notices if they are misused, and their rights make reviews harder."
remediation = [
  "For each listed sMSA, confirm with the service owner whether it is still needed.",
  "Remove sMSAs that are no longer used.",
  "Where an sMSA is still needed, link it to its computer again, or move the service to a gMSA.",
]
frameworks = [
  "NIST 800-53 AC-2",
  "NIST 800-53 CM-8",
]
verify = '''
Get-ADServiceAccount -Filter * -Properties msDS-HostServiceAccountBL |
  Where-Object { $_.ObjectClass -eq 'msDS-ManagedServiceAccount' -and -not $_.'msDS-HostServiceAccountBL' } |
  Select-Object Name, DistinguishedName'''
mitre = ["T1078.002"]

[[check.detail.references]]
title = "Group Managed Service Accounts overview"
url = "https://learn.microsoft.com/windows-server/security/group-managed-service-accounts/group-managed-service-accounts-overview"

[[check.detail.references]]
title = "MITRE ATT&CK T1078.002: Valid Accounts: Domain Accounts"
url = "https://attack.mitre.org/techniques/T1078/002/"

[[check]]
id = "AD-SVC-010"
title = "Service account naming and ownership documented (description/manager populated)"
status = "implemented"
severity = "low"

[check.detail]
description = "An enabled user account with a service principal name (krbtgt excluded) has neither a description nor a manager set. Either one is enough to pass; the check does not judge account names."
impact = "Without a recorded purpose or owner nobody can say whether the account is still needed, who may change its password, or what breaks if it is disabled. Such accounts keep their rights and old passwords for years."
remediation = [
  "For each listed account, find the service and the person responsible for it.",
  "Record the purpose in description and the owner in manager.",
  "Disable accounts for which no service or owner can be found, after a period of monitoring.",
]
frameworks = [
  "CIS Controls 5.5",
  "NIST 800-53 AC-2",
]
verify = '''
Get-ADUser -LDAPFilter '(&(servicePrincipalName=*)(!(userAccountControl:1.2.840.113556.1.4.803:=2))(!(description=*))(!(manager=*)))' |
  Where-Object SamAccountName -ne 'krbtgt' | Select-Object Name, DistinguishedName'''
mitre = ["T1078.002"]

