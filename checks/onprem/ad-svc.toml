# AD-SVC: Service accounts

area = "AD-SVC"

[[check]]
id = "AD-SVC-001"
title = "gMSA adoption versus regular user service accounts"
status = "implemented"
severity = "low"

[check.detail]
description = "Lists every enabled user account that has a service principal name (krbtgt excluded), which is how services that run as ordinary user accounts appear in the directory, and counts the group managed service accounts (gMSAs) in the domain. Each listed account is a candidate for moving to a gMSA."
impact = "A user service account has a password that a person chose and rarely changes, and anyone in the domain can request a Kerberos ticket for its SPN and try to crack that password offline. A gMSA has a random 120-character password that the domain changes automatically, so it cannot be cracked or leaked from a script."
attack = [
  "Signs in as any domain user and lists accounts with SPNs.",
  "Requests service tickets for them and cracks the passwords offline (Kerberoasting).",
  "Uses the recovered service account password wherever the account has rights.",
]
remediation = [
  "For each listed account, check whether the service supports gMSAs (Windows services, scheduled tasks, IIS application pools and SQL Server do).",
  "Create a gMSA, allow only the servers that run the service to retrieve its password, and move the service and its SPNs to it.",
  "Disable the old user account once the service runs under the gMSA.",
]
frameworks = [
  "CIS Controls 5.5",
  "NIST 800-53 IA-5",
]
verify = '''
Get-ADUser -LDAPFilter '(&(servicePrincipalName=*)(!(userAccountControl:1.2.840.113556.1.4.803:=2)))' -Properties servicePrincipalName |
  Where-Object SamAccountName -ne 'krbtgt' | Select-Object Name, servicePrincipalName
Get-ADServiceAccount -Filter * | Select-Object Name, ObjectClass'''
mitre = ["T1558.003"]

[[check.detail.references]]
title = "Group Managed Service Accounts overview"
url = "https://learn.microsoft.com/windows-server/security/group-managed-service-accounts/group-managed-service-accounts-overview"

[[check.detail.references]]
title = "MITRE ATT&CK T1558.003: Kerberoasting"
url = "https://attack.mitre.org/techniques/T1558/003/"

[[check]]
id = "AD-SVC-002"
title = "gMSA PrincipalsAllowedToRetrieveManagedPassword too broad"
status = "implemented"
severity = "high"

[check.detail]
description = "A group managed service account lets broad principals retrieve its password (msDS-GroupMSAMembership, shown as PrincipalsAllowedToRetrieveManagedPassword): Everyone, Authenticated Users, Anonymous Logon, Domain Users or Domain Computers, or any group with more than 50 members counted recursively. Only the servers that run the service should be able to retrieve it."
impact = "Every principal allowed to retrieve the password can read it in clear form from a DC and sign in as the gMSA. With a broad group, any user or computer in that group gets the gMSA's rights, which are often administrative on the servers that run the service."
attack = [
  "Takes control of any member of the allowed group, such as an ordinary user or workstation.",
  "Reads the gMSA's msDS-ManagedPassword attribute from a DC.",
  "Signs in as the gMSA with its password hash and uses its rights.",
]
remediation = [
  "Set PrincipalsAllowedToRetrieveManagedPassword to the computer accounts that run the service, or a small group containing only them.",
  "After narrowing it, check where the gMSA has rights and whether the password may already have been read; if so, replace the gMSA.",
]
frameworks = [
  "NIST 800-53 AC-6",
  "NIST 800-53 IA-5",
]
verify = '''
Get-ADServiceAccount -Filter * -Properties PrincipalsAllowedToRetrieveManagedPassword |
  Where-Object ObjectClass -eq 'msDS-GroupManagedServiceAccount' |
  Select-Object Name, PrincipalsAllowedToRetrieveManagedPassword'''
cvss = "AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N"
mitre = ["T1552", "T1078.002"]

