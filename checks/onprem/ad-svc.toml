[[check]]
id = "AD-SVC-005"
title = "Service accounts allowed to log on interactively"
status = "implemented"
severity = "medium"

[check.detail]
description = "Enabled service accounts (users with an SPN) are not denied local or Remote Desktop sign-in by any GPO."
impact = "Service account passwords are often known to several people and rarely changed. If they can sign in interactively, they can be used to log on to servers and leave credentials there."
remediation = [
  "Put service accounts in a group and deny it \"Log on locally\" and \"Log on through Remote Desktop Services\" in a GPO that applies to servers.",
  "Move services to group managed service accounts.",
]
verify = "secedit /export /cfg C:\\Temp\\gpo.inf /areas USER_RIGHTS; Select-String 'SeDeny(Remote)?InteractiveLogonRight' C:\\Temp\\gpo.inf"
mitre = ["T1078.002"]

[[check]]
id = "AD-SVC-006"
title = "Service accounts with password never expires and old passwords"
status = "implemented"
severity = "medium"

[check.detail]
description = "An enabled user account with a service principal name (krbtgt excluded) has Password never expires set and its password was last changed more than 365 days ago, or never."
impact = "Anyone in the domain can request a service ticket for the account and crack its password offline. An old password has had more time to be cracked, reused or written down, and every person who knew it over the years still does."
attack = [
  "Signs in as any domain user and requests service tickets for accounts with SPNs.",
  "Cracks the old password offline (Kerberoasting) or finds it in old scripts and documents.",
  "Signs in as the service account wherever it has rights.",
]
remediation = [
  "Move the service to a gMSA, which changes its password automatically.",
  "Where that is not possible, set a long random password (at least 25 characters) and change it at least yearly.",
  "Record who owns each service account so the change can be coordinated with the service.",
]
frameworks = [
  "CIS Controls 5.2",
  "NIST 800-53 IA-5",
]
verify = '''
Get-ADUser -LDAPFilter '(&(servicePrincipalName=*)(!(userAccountControl:1.2.840.113556.1.4.803:=2))(userAccountControl:1.2.840.113556.1.4.803:=65536))' -Properties PasswordLastSet |
  Where-Object { $_.SamAccountName -ne 'krbtgt' -and (-not $_.PasswordLastSet -or $_.PasswordLastSet -lt (Get-Date).AddDays(-365)) } |
  Select-Object Name, PasswordLastSet'''
cvss = "AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:N"
mitre = ["T1558.003", "T1110"]

