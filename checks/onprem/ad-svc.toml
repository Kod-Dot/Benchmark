[[check]]
id = "AD-SVC-003"
title = "KDS root key present"
status = "implemented"
severity = "low"

[check.detail]
description = "Checks that at least one KDS root key (msKds-ProvRootKey under CN=Master Root Keys in the configuration partition) exists, and shows how many there are and when the newest was created. Without a KDS root key no group managed service account can be created, so services keep running as user accounts with passwords."
impact = "Without a KDS root key the domain cannot use gMSAs, which leaves services on user accounts whose passwords can be cracked through Kerberoasting or leak from scripts and configuration files."
remediation = [
  "Create a KDS root key with Add-KdsRootKey as an Enterprise Admin or Domain Admin in the forest root domain.",
  "Wait for it to replicate to all DCs before creating gMSAs (by default it becomes usable 10 hours after creation).",
  "Then move user service accounts to gMSAs (see AD-SVC-001).",
]
frameworks = [
  "NIST 800-53 IA-5",
]
verify = '''
$cfg = (Get-ADRootDSE).configurationNamingContext
Get-ADObject -SearchBase "CN=Master Root Keys,CN=Group Key Distribution Service,CN=Services,$cfg" -LDAPFilter '(objectClass=msKds-ProvRootKey)' -Properties whenCreated |
  Select-Object Name, whenCreated'''
mitre = ["T1558.003"]

[[check.detail.references]]
title = "Create the Key Distribution Services KDS root key"
url = "https://learn.microsoft.com/windows-server/security/group-managed-service-accounts/create-the-key-distribution-services-kds-root-key"

