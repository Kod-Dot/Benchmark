[[check]]
id = "AD-SVC-004"
title = "dMSA (delegated MSA, Server 2025) configuration and BadSuccessor exposure (who can create dMSAs in which OUs)"
status = "implemented"
severity = "high"

[check.detail]
description = "Lists OUs, containers and the domain head where a principal other than the built-in admin groups, domain controllers and Tier 0 can create a delegated managed service account (dMSA): it owns the object, or holds Full Control, Modify permissions, Take ownership, or Create child for all object types or for the msDS-DelegatedManagedServiceAccount class. Entries that only apply to child objects are ignored. dMSAs exist only once a Windows Server 2025 domain controller is in the domain, so the check fails only when such a DC is found (identified by its operatingSystem). Without one it passes and lists, as evidence, the OUs to fix before the first Windows Server 2025 DC is added."
impact = "Whoever can create a dMSA controls its attributes, including the link that names the account it supersedes (BadSuccessor). On an unpatched Windows Server 2025 DC this lets the creator obtain tickets carrying the privileges and keys of any account, including Domain Admins and krbtgt, so create-child rights on a single OU become domain compromise."
attack = [
  "Takes control of a principal that can create objects in an OU, for example a helpdesk delegate.",
  "Creates a dMSA in that OU and sets it as the successor of a Domain Admin account.",
  "Requests a Kerberos ticket as the dMSA, which a Windows Server 2025 DC issues with the Domain Admin's privileges.",
]
remediation = [
  "Install the security update for CVE-2025-53779 on every Windows Server 2025 domain controller.",
  "On each listed OU, remove Create child for all objects and for dMSAs, Full Control, Modify permissions and Take ownership from principals that are not Tier 0 admins; delegate creation of specific object classes instead.",
  "Make sure non-admins do not own OUs or containers; change the owner to Domain Admins.",
  "Fix the listed OUs before adding the first Windows Server 2025 DC.",
]
frameworks = [
  "NIST 800-53 AC-6",
  "NIST 800-53 SI-2",
]
verify = '''
Get-ADDomainController -Filter * | Select-Object Name, OperatingSystem
Get-ADOrganizationalUnit -Filter * | ForEach-Object {
  $ou = $_.DistinguishedName
  (Get-Acl "AD:$ou").Access | Where-Object {
    $_.AccessControlType -eq 'Allow' -and (
      $_.ActiveDirectoryRights -match 'GenericAll|WriteDacl|WriteOwner' -or
      ($_.ActiveDirectoryRights -match 'CreateChild' -and $_.ObjectType -in [guid]::Empty, [guid]'0feb936f-47b3-49f2-9386-1dedc2c23765'))
  } | Select-Object @{ n = 'OU'; e = { $ou } }, IdentityReference, ActiveDirectoryRights, ObjectType
}'''
cvss = "AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H"
mitre = ["T1068", "T1098", "T1078.002"]

