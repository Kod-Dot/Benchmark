[[check]]
id = "AD-IOC-014"
title = "Computer accounts with userAccountControl SERVER_TRUST_ACCOUNT that are not DCs"
status = "implemented"
severity = "high"

[check.detail]
description = "A computer account has SERVER_TRUST_ACCOUNT (0x2000) set in userAccountControl, which marks it as a writable domain controller, but no directory service agent (NTDS Settings under a server in CN=Sites) has a server object linked to it. Read-only DCs use a different flag and are not considered. A real DC always has a directory service agent, so the computer is marked as a DC without being one."
impact = "Setting SERVER_TRUST_ACCOUNT makes the computer's primary group Domain Controllers, which holds replication rights on the domain. Whoever knows the computer's password can then use DCSync to read every password hash, including krbtgt, while the computer looks like an ordinary server."
attack = [
  "Gains rights to modify a computer account they control, as a Domain Admin or through delegated write access.",
  "Sets SERVER_TRUST_ACCOUNT on it, which moves it into Domain Controllers.",
  "Uses the computer account's credentials to replicate password hashes from a real DC (DCSync).",
]
remediation = [
  "For each listed computer, check whether it is a DC whose promotion or demotion failed; if so, finish the demotion and run metadata cleanup.",
  "Otherwise set userAccountControl back to WORKSTATION_TRUST_ACCOUNT, set its primary group back to Domain Computers, and reset the computer's password.",
  "Treat an unexplained change as a compromise and investigate who made it.",
]
frameworks = [
  "NIST 800-53 AC-6",
  "NIST 800-53 CM-8",
]
verify = '''
$cfg = (Get-ADRootDSE).configurationNamingContext
$linked = Get-ADObject -SearchBase "CN=Sites,$cfg" -LDAPFilter '(objectClass=nTDSDSA)' | ForEach-Object {
  (Get-ADObject ($_.DistinguishedName -replace '^CN=NTDS Settings,', '') -Properties serverReference).serverReference
}
Get-ADComputer -LDAPFilter '(userAccountControl:1.2.840.113556.1.4.803:=8192)' |
  Where-Object { $linked -notcontains $_.DistinguishedName } | Select-Object Name, DistinguishedName'''
