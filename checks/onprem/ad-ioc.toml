[[check]]
id = "AD-IOC-009"
title = "primaryGroupID set to 512/519 on non-admin accounts"
status = "implemented"
severity = "high"

[check.detail]
description = "User or computer accounts have Domain Admins, Schema Admins or Enterprise Admins as their primary group."
impact = "Primary group membership does not appear in the group's member list, so the account has the privileges without being listed. This is a persistence technique."
remediation = [
  "Set the primary group to Domain Users (513) or Domain Computers (515).",
  "Review how the account got the change.",
]
verify = "Get-ADObject -LDAPFilter '(|(primaryGroupID=512)(primaryGroupID=518)(primaryGroupID=519))' -Properties primaryGroupID"
mitre = ["T1098", "T1078.002"]

[[check]]
id = "AD-IOC-010"
title = "Recently created privileged accounts"
status = "implemented"
severity = "medium"

[check.detail]
description = "A user account, enabled or disabled, that is a direct or nested member of an admin group (Domain Admins, Enterprise Admins, Schema Admins, Key Admins, Enterprise Key Admins, Administrators, Account Operators, Server Operators, Print Operators, Backup Operators or DnsAdmins) was created in the last 30 days, judged by whenCreated. A new admin account is often legitimate; it has to be one the administrators know about and approved."
impact = "Creating a new admin account is a common way for an attacker to keep access after gaining Domain Admin. An unapproved account gives that attacker a separate way back in that survives password resets of the compromised accounts."
attack = [
  "Gains rights to create users and change admin group membership.",
  "Creates a new account with an inconspicuous name and adds it to an admin group, directly or through a nested group.",
  "Uses the account to return later.",
]
remediation = [
  "Confirm each listed account with the person responsible for admin accounts and check the request or change record.",
  "Disable and investigate any account that nobody can account for, including who created it (audit event 4720 on the DCs).",
  "Require a change record for every new admin account and alert on additions to admin groups.",
]
frameworks = [
  "NIST 800-53 AC-2",
  "NIST 800-53 AU-6",
]
verify = '''
$since = (Get-Date).AddDays(-30)
'Domain Admins', 'Enterprise Admins', 'Schema Admins', 'Administrators', 'Account Operators', 'Backup Operators' |
  ForEach-Object { Get-ADGroupMember $_ -Recursive } | Where-Object objectClass -eq 'user' |
  Sort-Object distinguishedName -Unique | Get-ADUser -Properties whenCreated |
  Where-Object whenCreated -gt $since | Select-Object Name, whenCreated'''
mitre = ["T1136.002", "T1098"]

[[check.detail.references]]
title = "MITRE ATT&CK T1136.002: Create Account: Domain Account"
url = "https://attack.mitre.org/techniques/T1136/002/"

[[check.detail.references]]
title = "Monitoring Active Directory for signs of compromise"
url = "https://learn.microsoft.com/windows-server/identity/ad-ds/plan/security-best-practices/monitoring-active-directory-for-signs-of-compromise"

[[check]]
id = "AD-IOC-011"
title = "Delegation to krbtgt (constrained delegation to krbtgt/* or RBCD on krbtgt)"
status = "implemented"
severity = "critical"

[check.detail]
description = "A user or computer account lists a krbtgt service (krbtgt/...) in msDS-AllowedToDelegateTo, or the krbtgt account itself has resource-based constrained delegation set (msDS-AllowedToActOnBehalfOfOtherIdentity). No legitimate service delegates to krbtgt."
impact = "Delegation to krbtgt lets the account obtain a ticket-granting ticket for any user, including Domain Admins, from a service ticket it requests on their behalf. Whoever controls the account can impersonate anyone in the domain; it is a known persistence technique."
attack = [
  "Gains Domain Admin rights once.",
  "Sets constrained delegation from a controlled account to krbtgt/DOMAIN, or adds that account to the RBCD list on krbtgt.",
  "Later uses S4U2Self and S4U2Proxy from the controlled account to obtain a ticket-granting ticket for any admin.",
]
remediation = [
  "Remove every krbtgt entry from msDS-AllowedToDelegateTo on the listed accounts.",
  "Clear msDS-AllowedToActOnBehalfOfOtherIdentity on krbtgt.",
  "Treat the domain as compromised: reset the listed accounts' passwords, investigate who set the delegation and reset the krbtgt password twice.",
]
frameworks = [
  "NIST 800-53 AC-6",
  "NIST 800-53 IA-2",
]
verify = '''
Get-ADObject -LDAPFilter '(msDS-AllowedToDelegateTo=krbtgt/*)' -Properties msDS-AllowedToDelegateTo |
  Select-Object Name, msDS-AllowedToDelegateTo
Get-ADUser krbtgt -Properties msDS-AllowedToActOnBehalfOfOtherIdentity |
  Select-Object Name, msDS-AllowedToActOnBehalfOfOtherIdentity'''
cvss = "AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H"
mitre = ["T1558", "T1098"]

[[check.detail.references]]
title = "Kerberos constrained delegation overview"
url = "https://learn.microsoft.com/windows-server/security/kerberos/kerberos-constrained-delegation-overview"

[[check.detail.references]]
title = "MITRE ATT&CK T1558: Steal or Forge Kerberos Tickets"
url = "https://attack.mitre.org/techniques/T1558/"

[[check]]
id = "AD-IOC-012"
title = "Unexpected ACEs granting DCSync created recently (from metadata)"
status = "implemented"
severity = "critical"

[check.detail]
description = "The domain head's permissions changed in the last 30 days and principals outside the defaults hold DCSync rights."
impact = "Granting DCSync rights is a common persistence step: the holder can read every password hash, including krbtgt's, at any time."
remediation = [
  "Confirm who granted the rights and why.",
  "Remove the replication rights unless the account is a documented sync tool.",
]
verify = "Get-ADReplicationAttributeMetadata -Object (Get-ADDomain).DistinguishedName -Server <DC> | Where-Object AttributeName -eq nTSecurityDescriptor"
cvss = "AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:N"
mitre = ["T1003.006", "T1222.001"]

[[check]]
id = "AD-IOC-013"
title = "Golden gMSA exposure (KDS root key read rights)"
status = "implemented"
severity = "critical"

[check.detail]
description = "Principals other than the built-in admin groups, domain controllers and Tier 0 can read KDS root keys (msKds-ProvRootKey objects under CN=Master Root Keys in the configuration partition). The check counts allow entries that grant Full Control, Generic Read, or Read Property for all properties; entries that only apply to child objects are ignored. When no KDS root key exists the check passes."
impact = "The KDS root key is the secret from which every gMSA password in the forest is derived. A principal that can read it can compute the current and future password of every gMSA offline (Golden gMSA) and sign in as any of them, without any further access to a DC. Resetting gMSA passwords does not help while the key is exposed."
attack = [
  "Takes control of a principal that can read a KDS root key.",
  "Reads the root key attributes and the gMSA's password parameters from the directory.",
  "Computes the gMSA's password offline and signs in as the gMSA, wherever it has rights.",
]
remediation = [
  "Remove the read rights for every listed principal from the KDS root key objects; leave only the default admin groups, SYSTEM and domain controllers.",
  "Find out how the rights were granted; if a non-admin could read the key, assume every gMSA password is known.",
  "In that case create a new KDS root key, move gMSAs to new accounts created after it, and delete the old gMSAs.",
]
frameworks = [
  "NIST 800-53 SC-12",
  "NIST 800-53 AC-6",
]
verify = '''
$cfg = (Get-ADRootDSE).configurationNamingContext
Get-ADObject -SearchBase "CN=Master Root Keys,CN=Group Key Distribution Service,CN=Services,$cfg" -LDAPFilter '(objectClass=msKds-ProvRootKey)' -Properties nTSecurityDescriptor |
  ForEach-Object {
    $key = $_.Name
    $_.nTSecurityDescriptor.Access | Where-Object { $_.AccessControlType -eq 'Allow' -and $_.ActiveDirectoryRights -match 'GenericAll|GenericRead|ReadProperty' } |
      Select-Object @{ n = 'Key'; e = { $key } }, IdentityReference, ActiveDirectoryRights, ObjectType
  }'''
cvss = "AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:N"
mitre = ["T1552", "T1078.002"]

