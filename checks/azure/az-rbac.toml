[[check]]
id = "AZ-RBAC-004"
title = "Guests with Azure roles"
status = "implemented"
severity = "high"

[check.detail]
description = "One or more guest (B2B) users have an active or PIM eligible Azure role assignment on a management group, subscription, resource group or resource. Guest accounts sign in with credentials managed by another organization."
impact = "Your control over the account depends on the home tenant's security: its password policy, MFA and offboarding. If the guest's home account is compromised or the person leaves that organization without their guest account being removed, the access to your Azure resources stays in place."
attack = [
  "Compromises the guest's account in its home tenant, where your organization has no visibility.",
  "Signs in to your tenant as the guest and uses the Azure role assignment.",
  "Reads or changes resources within the scope of the role.",
]
remediation = [
  "Review each guest assignment in Access control (IAM) on the scope shown and remove assignments that are not needed.",
  "Require MFA for guests with a Conditional Access policy, and set cross-tenant access settings to trust MFA only from known partners.",
  "Make remaining guest assignments PIM eligible with an end date, and include them in Microsoft Entra access reviews.",
]
frameworks = [
  "Microsoft cloud security benchmark",
  "CIS Microsoft Azure Foundations Benchmark",
  "NIST 800-53 AC-2",
  "NIST 800-53 AC-6",
]
verify = '''
$guests = Get-AzADUser -Filter "userType eq 'Guest'" | Select-Object -ExpandProperty Id
Get-AzRoleAssignment | Where-Object { $_.ObjectId -in $guests } | Select-Object DisplayName, SignInName, RoleDefinitionName, Scope'''
cvss = "AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H"
mitre = ["T1078.004", "T1199"]

[[check.detail.references]]
title = "Best practices for Azure RBAC"
url = "https://learn.microsoft.com/azure/role-based-access-control/best-practices"

[[check.detail.references]]
title = "MITRE ATT&CK T1199: Trusted Relationship"
url = "https://attack.mitre.org/techniques/T1199/"

[[check]]
id = "AZ-RBAC-005"
title = "Service principals and managed identities with Owner/UAA"
status = "implemented"
severity = "high"

[check.detail]
description = "One or more service principals or managed identities hold Owner, User Access Administrator or Role Based Access Control Administrator at subscription scope or above. These roles can assign Azure roles to any principal."
impact = "Anyone who obtains the application's secret or certificate, or who can run code on the resource that owns the managed identity, can grant themselves full control of the subscription. Service principal sign-ins are not covered by user MFA and are often monitored less closely than user sign-ins."
attack = [
  "Finds a client secret or certificate for the service principal, adds its own credential to the application, or runs code on a resource with the managed identity.",
  "Requests a token for Azure Resource Manager as that identity.",
  "Assigns Owner on the subscription to an account it controls.",
]
remediation = [
  "Review each assignment and replace Owner with the narrowest built-in role the automation needs, such as Contributor on a resource group.",
  "Remove User Access Administrator and Role Based Access Control Administrator from identities that do not deploy role assignments; where they must, add a condition limiting which roles can be assigned.",
  "Restrict who can manage the application's credentials and who can run code on resources with the managed identity.",
]
frameworks = [
  "Microsoft cloud security benchmark",
  "NIST 800-53 AC-6",
]
verify = '''
Get-AzRoleAssignment | Where-Object { $_.ObjectType -eq 'ServicePrincipal' -and $_.RoleDefinitionName -in 'Owner','User Access Administrator','Role Based Access Control Administrator' } |
  Select-Object DisplayName, RoleDefinitionName, Scope'''
cvss = "AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:H"
mitre = ["T1078.004", "T1098.001", "T1528"]

[[check.detail.references]]
title = "Best practices for Azure RBAC"
url = "https://learn.microsoft.com/azure/role-based-access-control/best-practices"

[[check.detail.references]]
title = "MITRE ATT&CK T1098.001: Account Manipulation: Additional Cloud Credentials"
url = "https://attack.mitre.org/techniques/T1098/001/"

[[check]]
id = "AZ-RBAC-006"
title = "Custom Azure roles with `*` actions or `Microsoft.Authorization/*/write`"
status = "implemented"
severity = "high"

[check.detail]
description = "One or more custom Azure roles allow \"*\", \"*/write\", Microsoft.Authorization/*, Microsoft.Authorization/roleAssignments/write or Microsoft.Authorization/roleDefinitions/write in their actions, and the permission is not removed by the role's notActions. Such a role grants full control or the right to change role assignments and role definitions."
impact = "A role that can write role assignments or role definitions is equivalent to Owner: the holder can grant itself any role or widen the custom role. Because the role has a custom name, it is easy to miss in reviews that only look for Owner and User Access Administrator."
attack = [
  "Compromises a principal assigned the custom role.",
  "Writes a new role assignment giving itself Owner, or edits the custom role to add the actions it needs.",
  "Uses the new permissions on every resource in the role's assignable scopes.",
]
remediation = [
  "Review the role in the Azure portal under Access control (IAM), Roles, filtered to Custom roles.",
  "Replace wildcard actions with the specific resource provider actions the role needs, and remove Microsoft.Authorization write actions unless the role is meant to manage access.",
  "Update the role with Set-AzRoleDefinition or az role definition update after editing its JSON.",
]
frameworks = [
  "Microsoft cloud security benchmark",
  "CIS Microsoft Azure Foundations Benchmark",
  "NIST 800-53 AC-6",
]
verify = '''
Get-AzRoleDefinition -Custom | Select-Object Name, Actions, NotActions, AssignableScopes'''
cvss = "AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:H"
mitre = ["T1098.003"]

[[check.detail.references]]
title = "Azure custom roles"
url = "https://learn.microsoft.com/azure/role-based-access-control/custom-roles"

[[check.detail.references]]
title = "MITRE ATT&CK T1098.003: Account Manipulation: Additional Cloud Roles"
url = "https://attack.mitre.org/techniques/T1098/003/"

