[[check]]
id = "AZ-RBAC-002"
title = "Owner, Contributor and User Access Administrator assignments at root/MG/subscription scope"
status = "implemented"
severity = "high"

[check.detail]
description = "One or more principals hold Owner, Contributor, User Access Administrator or Role Based Access Control Administrator on a management group or at root scope. These assignments are inherited by every subscription below that scope. The count of these privileged assignments per subscription is shown as evidence."
impact = "A single principal at management group scope has write access to, or can grant access to, every subscription under it. Owner, User Access Administrator and Role Based Access Control Administrator can assign roles, so the holder can give itself or an attacker full control of all those subscriptions."
attack = [
  "Compromises an account, group member or service principal assigned a privileged role on a management group.",
  "Assigns itself Owner on a subscription below that management group, or uses Contributor directly.",
  "Changes or reads resources across every inherited subscription.",
]
remediation = [
  "Review each assignment in the Azure portal under Management groups, the group, Access control (IAM), Role assignments.",
  "Remove assignments that are not needed, or move them to the specific subscription or resource group where the work happens.",
  "Replace Owner and Contributor with narrower built-in roles where possible, and add conditions to Role Based Access Control Administrator assignments to limit which roles it can grant.",
  "Make remaining assignments PIM eligible instead of active.",
]
frameworks = [
  "Microsoft cloud security benchmark",
  "CIS Microsoft Azure Foundations Benchmark",
  "NIST 800-53 AC-6",
]
verify = '''
Get-AzManagementGroup | ForEach-Object {
  Get-AzRoleAssignment -Scope $_.Id | Where-Object { $_.RoleDefinitionName -in 'Owner','Contributor','User Access Administrator','Role Based Access Control Administrator' }
} | Select-Object DisplayName, RoleDefinitionName, Scope, ObjectType'''
cvss = "AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:H"
mitre = ["T1078.004", "T1098.003"]

