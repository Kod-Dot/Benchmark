[[check]]
id = "AZ-RBAC-008"
title = "Orphaned role assignments (deleted principals)"
status = "implemented"
severity = "low"

[check.detail]
description = "One or more Azure role assignments point to a principal object id that no longer exists in Microsoft Entra ID. The portal shows these as Identity not found, with object type Unknown."
impact = "An orphaned assignment grants nothing today, but it clutters access reviews and hides which access is real. Leftover assignments also show that offboarding does not remove Azure access, so other assignments for departed users or deleted apps may still be active."
attack = [
  "Uses the confusion from stale entries during access reviews to keep its own unneeded assignment in place.",
]
remediation = [
  "Remove each orphaned assignment in Access control (IAM), Role assignments, or with Remove-AzRoleAssignment -ObjectId <id> -RoleDefinitionName <role> -Scope <scope>.",
  "Add removal of Azure role assignments to the offboarding process for users, groups and applications.",
]
frameworks = [
  "Microsoft cloud security benchmark",
  "NIST 800-53 AC-2",
]
verify = '''
Get-AzRoleAssignment | Where-Object ObjectType -eq 'Unknown' | Select-Object ObjectId, RoleDefinitionName, Scope'''
cvss = "AV:N/AC:H/PR:H/UI:N/S:U/C:L/I:N/A:N"
mitre = ["T1078.004"]

[[check.detail.references]]
title = "Troubleshoot Azure RBAC"
url = "https://learn.microsoft.com/azure/role-based-access-control/troubleshooting"

[[check]]
id = "AZ-RBAC-009"
title = "Subscriptions without owners or security contacts"
status = "implemented"
severity = "medium"

[check.detail]
description = "One or more subscriptions have no Owner, either directly assigned or inherited from a management group, or have no security contact email configured in Microsoft Defender for Cloud."
impact = "Without an Owner, nobody is accountable for the subscription and access changes need a tenant-level administrator. Without a security contact, Defender for Cloud alerts about active attacks on the subscription's resources are not emailed to anyone and can go unnoticed."
attack = [
  "Targets resources in a subscription where nobody receives Defender for Cloud alert emails.",
  "Operates in that subscription while the alerts it triggers are not acted on.",
]
remediation = [
  "Assign Owner on each subscription to a named group responsible for it, preferably as a PIM eligible assignment.",
  "In Defender for Cloud, Environment settings, the subscription, Email notifications, add one or more security contact addresses and turn on notifications for high severity alerts.",
]
frameworks = [
  "Microsoft cloud security benchmark",
  "CIS Microsoft Azure Foundations Benchmark",
  "NIST 800-53 IR-6",
]
verify = '''
Get-AzRoleAssignment -RoleDefinitionName Owner | Select-Object DisplayName, Scope
Get-AzSecurityContact | Select-Object Name, Email, AlertNotifications'''
cvss = "AV:N/AC:H/PR:L/UI:N/S:U/C:L/I:L/A:N"
mitre = ["T1078.004"]

[[check.detail.references]]
title = "Configure email notifications for security alerts"
url = "https://learn.microsoft.com/azure/defender-for-cloud/configure-email-notifications"

