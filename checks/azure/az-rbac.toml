[[check]]
id = "AZ-RBAC-011"
title = "Azure Policy assignments for security baseline (informational coverage)"
status = "implemented"
severity = "low"

[check.detail]
description = "One or more subscriptions do not have the Microsoft cloud security benchmark initiative assigned, either directly or from a management group. Defender for Cloud uses this initiative to assess resources and produce its recommendations and secure score."
impact = "Without the initiative, Defender for Cloud does not assess the subscription against the benchmark, so misconfigurations such as public storage or missing encryption are not reported and the secure score does not reflect the subscription."
attack = [
  "Uses misconfigured resources in a subscription that is not assessed, where nobody is told about the weakness.",
]
remediation = [
  "In Defender for Cloud, Environment settings, the subscription, Security policies, turn on the Microsoft cloud security benchmark standard.",
  "Alternatively, assign the Microsoft cloud security benchmark initiative on the management group that contains the subscriptions.",
]
frameworks = [
  "Microsoft cloud security benchmark",
  "NIST 800-53 CA-7",
]
verify = '''
Get-AzPolicyAssignment | Where-Object { $_.Properties.DisplayName -like '*Microsoft cloud security benchmark*' -or $_.DisplayName -like '*Microsoft cloud security benchmark*' } |
  Select-Object Name, Scope'''
cvss = "AV:N/AC:H/PR:N/UI:N/S:U/C:L/I:L/A:N"

[[check.detail.references]]
title = "Introduction to the Microsoft cloud security benchmark"
url = "https://learn.microsoft.com/security/benchmark/azure/introduction"

[[check]]
id = "AZ-RBAC-012"
title = "Defender for Cloud plans enabled per subscription"
status = "implemented"
severity = "medium"

[check.detail]
description = "One or more subscriptions have a Microsoft Defender for Cloud plan on the Free tier instead of Standard for VirtualMachines (Defender for Servers), SqlServers, StorageAccounts, KeyVaults, Arm (Defender for Resource Manager) or Containers."
impact = "Without these plans, Defender for Cloud does not raise threat detection alerts for those resource types: no alerts for suspicious Key Vault access, malicious storage uploads, unusual Azure Resource Manager operations or attacks on servers and containers. An intrusion in those resources can go undetected."
attack = [
  "Signs in with stolen credentials and lists or reads Key Vault secrets, storage data or Resource Manager configuration.",
  "Performs the actions without triggering Defender alerts, because the plan for that resource type is off.",
]
remediation = [
  "In Defender for Cloud, Environment settings, the subscription, Defender plans, turn on the plans for Servers, Databases, Storage, Key Vault, Resource Manager and Containers.",
  "Or run Set-AzSecurityPricing -Name <plan> -PricingTier Standard for each plan.",
  "Apply the plans at scale with the Azure Policy definitions for Defender plans on the management group.",
]
frameworks = [
  "Microsoft cloud security benchmark",
  "CIS Microsoft Azure Foundations Benchmark",
  "NIST 800-53 SI-4",
]
verify = '''
Get-AzSecurityPricing | Where-Object Name -in 'VirtualMachines','SqlServers','StorageAccounts','KeyVaults','Arm','Containers' |
  Select-Object Name, PricingTier'''
cvss = "AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:L/A:N"
mitre = ["T1078.004"]

