[[check]]
id = "AZ-RBAC-003"
title = "Permanent vs PIM-eligible Azure role assignments"
status = "implemented"
severity = "medium"

[check.detail]
description = "One or more users hold Owner, Contributor, User Access Administrator or Role Based Access Control Administrator at subscription scope or above as a permanent active assignment: not PIM eligible, with no end date, and with assignment type Assigned rather than Activated. The number of PIM eligible assignments for these roles is shown for comparison."
impact = "A permanent assignment gives the user standing privileged access at all times. If the account is phished or its session token is stolen, the attacker has that access immediately, without the approval, MFA and justification that PIM activation would require."
attack = [
  "Phishes or steals a session for a user with a permanent privileged Azure role.",
  "Uses the role right away, with no activation step to trigger approval or an alert.",
  "Assigns roles to other accounts or changes resources across the subscription.",
]
remediation = [
  "In Microsoft Entra Privileged Identity Management, open Azure resources, select the subscription or management group, and convert permanent active assignments to eligible assignments.",
  "Set role settings to require MFA, justification and, for Owner and User Access Administrator, approval on activation.",
  "Keep at most a small number of break-glass permanent assignments and monitor their use.",
]
frameworks = [
  "Microsoft cloud security benchmark",
  "CIS Microsoft Azure Foundations Benchmark",
  "NIST 800-53 AC-2",
  "NIST 800-53 AC-6",
]
verify = '''
$sub = (Get-AzContext).Subscription.Id
Get-AzRoleAssignmentSchedule -Scope "/subscriptions/$sub" | Where-Object { $_.AssignmentType -eq 'Assigned' -and -not $_.EndDateTime } |
  Select-Object PrincipalId, PrincipalType, RoleDefinitionDisplayName, Scope
Get-AzRoleEligibilitySchedule -Scope "/subscriptions/$sub" | Select-Object PrincipalId, RoleDefinitionDisplayName, EndDateTime'''
cvss = "AV:N/AC:H/PR:N/UI:R/S:U/C:H/I:H/A:H"
mitre = ["T1078.004"]

