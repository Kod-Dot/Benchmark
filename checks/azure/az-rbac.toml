severity = "medium"

[check.detail]
description = "One or more storage accounts allow anonymous (public) blob access, or allow shared key authorization. With anonymous access allowed, any container set to Blob or Container access level can be read without credentials. With shared key access allowed, anyone holding an account key or a SAS signed with it has full access, bypassing Microsoft Entra ID and Azure RBAC."
impact = "Data in public containers can be downloaded by anyone on the internet who finds the URL. Leaked account keys or SAS tokens, which often appear in code, scripts and connection strings, give access to all data in the account without any sign-in, MFA or Conditional Access."
attack = [
  "Finds a public container URL or an account key or SAS token in code, a script or a configuration file.",
  "Reads or writes blobs directly with the key or anonymously, without signing in to Microsoft Entra ID.",
]
remediation = [
  "In the storage account, Settings, Configuration, set Allow Blob anonymous access to Disabled, or run Set-AzStorageAccount -AllowBlobPublicAccess $false.",
  "Move applications to Microsoft Entra ID authorization, then set Allow storage account key access to Disabled (Set-AzStorageAccount -AllowSharedKeyAccess $false).",
  "Rotate account keys that may have been exposed.",
  "Enforce both settings with the built-in Azure Policy definitions for storage accounts.",
]
frameworks = [
  "Microsoft cloud security benchmark",
  "CIS Microsoft Azure Foundations Benchmark",
  "NIST 800-53 AC-3",
]
verify = '''
Get-AzStorageAccount | Select-Object StorageAccountName, ResourceGroupName, AllowBlobPublicAccess, AllowSharedKeyAccess'''
cvss = "AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:L/A:N"
mitre = ["T1552"]

[[check.detail.references]]
title = "Remediate anonymous read access to blob data"
url = "https://learn.microsoft.com/azure/storage/blobs/anonymous-read-access-prevent"

[[check.detail.references]]
title = "Prevent Shared Key authorization for an Azure Storage account"
url = "https://learn.microsoft.com/azure/storage/common/shared-key-authorization-prevent"

[[check]]
id = "AZ-RBAC-019"
title = "Deployment scripts / runbooks containing credentials (keyword scan)"
status = "implemented"
severity = "high"

[check.detail]
description = "A runbook or deployment script contains text that looks like a credential, or an unencrypted Automation variable is named like one. The collector scans the text and records only the type of match and the line number."
impact = "Anyone with read access to the Automation account or resource group can read the credential."
remediation = [
  "Move the credential to Key Vault or an encrypted Automation credential, use managed identities, and rotate the exposed secret.",
]
verify = "Review the reported runbook lines and variables in the Azure portal."
mitre = ["T1552"]

[[check.detail.references]]
title = "Automation credentials"
url = "https://learn.microsoft.com/azure/automation/shared-resources/credentials"

[[check]]
id = "AZ-RBAC-020"
title = "Azure VMs hosting DCs: who has VM Contributor, Run Command, disk snapshot rights (Tier 0 exposure)"
status = "implemented"
severity = "critical"

[check.detail]
description = "Lists who can control domain controller or Tier 0 VMs in Azure: Owner, Contributor, User Access Administrator, Virtual Machine Contributor, Virtual Machine Administrator Login or Disk Snapshot Contributor at or above the VM. VMs are matched to AD by computer name."
impact = "Run Command, extensions, sign-in or a disk snapshot of a DC gives full control of the domain, including the NTDS.dit database."
remediation = [
  "Put DC VMs in a dedicated subscription or resource group where only Tier 0 admins hold any of these roles, through PIM.",
]
verify = "Get-AzRoleAssignment -Scope <DC VM id>"
mitre = ["T1651"]

[[check.detail.references]]
title = "Securing domain controllers in Azure"
url = "https://learn.microsoft.com/windows-server/identity/ad-ds/plan/security-best-practices/securing-domain-controllers-against-attack"

[[check]]
id = "AZ-RBAC-021"
title = "Azure Arc-connected servers that are DCs or Tier 0, and who can run extensions on them"
status = "implemented"
severity = "critical"

[check.detail]
description = "Lists who can install extensions or run commands on domain controllers or Tier 0 servers connected to Azure Arc: Owner, Contributor, User Access Administrator, Azure Connected Machine Resource Administrator or Hybrid Server Resource Administrator."
impact = "Arc extensions and Run Command execute as SYSTEM on the server, so these roles control the domain."
remediation = [
  "Remove Arc from Tier 0 servers, or treat the Arc resource group as Tier 0 and limit these roles to Tier 0 admins.",
]
verify = "Get-AzRoleAssignment -Scope <Arc machine id>"
mitre = ["T1651"]

[[check.detail.references]]
title = "Azure Arc security overview"
url = "https://learn.microsoft.com/azure/azure-arc/servers/security-overview"

[[check]]
id = "AZ-RBAC-022"
title = "Azure Bastion / JIT VM access for Tier 0 VMs"
status = "implemented"
severity = "medium"

[check.detail]
description = "A domain controller or Tier 0 VM in Azure is covered neither by a just-in-time VM access policy nor by an Azure Bastion host in its subscription."
impact = "Management ports are reachable more widely and for longer than needed."
remediation = [
  "Reach Tier 0 VMs only through Azure Bastion or just-in-time access from Tier 0 admin workstations.",
]
verify = "Get-AzJitNetworkAccessPolicy"

[[check.detail.references]]
