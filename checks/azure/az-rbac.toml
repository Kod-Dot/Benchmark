# AZ-RBAC: Azure control plane and RBAC

area = "AZ-RBAC"

[[check]]
id = "AZ-RBAC-001"
title = "Management group hierarchy and root management group access"
status = "implemented"
severity = "high"

[check.detail]
description = "One or more Azure role assignments exist at the root scope \"/\" or on the tenant root management group. An assignment at either scope is inherited by every management group, subscription and resource in the tenant. Assignments at \"/\" are usually left behind after a Global Administrator used Elevate access, which grants User Access Administrator at root."
impact = "The assigned principal controls, or can grant itself control over, every subscription in the tenant, including subscriptions that host domain controllers, Key Vaults and identity infrastructure. A single compromised account at this scope compromises all of Azure."
attack = [
  "Compromises an account or service principal that holds a role at root scope or on the tenant root management group.",
  "Uses User Access Administrator or Owner at that scope to assign itself Owner on any subscription.",
  "Takes over the resources in those subscriptions, such as virtual machines, Key Vaults and storage.",
]
remediation = [
  "Remove role assignments at \"/\" that are no longer needed: Remove-AzRoleAssignment -Scope \"/\" -ObjectId <id> -RoleDefinitionName <role>.",
  "If a Global Administrator used Elevate access, turn it off in the Microsoft Entra admin center under Identity, Properties, Access management for Azure resources, set to No.",
  "Move needed assignments on the tenant root management group down to the narrowest management group or subscription that covers the work.",
  "Grant any role that must stay at this scope only through PIM eligible assignments.",
]
frameworks = [
  "Microsoft cloud security benchmark",
  "CIS Microsoft Azure Foundations Benchmark",
  "NIST 800-53 AC-6",
]
verify = '''
Get-AzRoleAssignment -Scope "/" | Where-Object Scope -eq "/" | Select-Object DisplayName, SignInName, RoleDefinitionName, ObjectType
$root = (Get-AzTenant).Id
Get-AzRoleAssignment -Scope "/providers/Microsoft.Management/managementGroups/$root" |
  Where-Object Scope -eq "/providers/Microsoft.Management/managementGroups/$root" | Select-Object DisplayName, RoleDefinitionName, ObjectType'''
cvss = "AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:H"
mitre = ["T1078.004", "T1098.003"]

