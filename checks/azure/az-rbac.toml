[[check]]
id = "AZ-RBAC-014"
title = "Activity log exported to Log Analytics / SIEM"
status = "implemented"
severity = "medium"

[check.detail]
description = "One or more subscriptions have no diagnostic setting that exports the Administrative category of the Azure activity log to a Log Analytics workspace, an event hub or a storage account. The platform keeps activity log entries for only 90 days."
impact = "Role assignment changes, resource deletions and other control plane operations are not sent to a SIEM, so they cannot be alerted on or correlated with sign-in data, and records older than 90 days are lost for incident investigation."
attack = [
  "Assigns itself a role or changes resources in the subscription.",
  "Relies on the change not reaching the SIEM, and on the activity log entry expiring after 90 days.",
]
remediation = [
  "In the Azure portal, Monitor, Activity log, Export Activity Logs, add a diagnostic setting for the subscription that sends at least the Administrative, Security and Policy categories to the central Log Analytics workspace.",
  "Apply the setting at scale with the built-in Azure Policy that configures activity log export to a Log Analytics workspace.",
]
frameworks = [
  "Microsoft cloud security benchmark",
  "CIS Microsoft Azure Foundations Benchmark",
  "NIST 800-53 AU-6",
  "NIST 800-53 AU-11",
]
verify = '''
az monitor diagnostic-settings subscription list --query "value[].{name:name, workspace:workspaceId, logs:logs[?enabled].category}"'''
cvss = "AV:N/AC:H/PR:H/UI:N/S:U/C:N/I:L/A:N"

