[[check]]
id = "HUNT-EN-014"
title = "Guest invitations at scale"
status = "implemented"
severity = "medium"

[check.detail]
description = "In the last 30 days of audit logs, one account invited 20 or more guests within 24 hours."
impact = "A finding is something to investigate, not proof of compromise: a project kickoff or a partner onboarding can involve many invitations. Mass invitations from one account can also mean a compromised account is bringing in outside accounts, giving them a foothold in Teams, SharePoint and apps, or that it is used to send phishing through invitation mails."
attack = [
  "Takes over a member account that is allowed to invite guests.",
  "Invites many external accounts, either the attacker's own or the targets of a phishing campaign.",
  "Uses the guest accounts to read shared content, or relies on the trusted Microsoft invitation mail to deliver phishing links.",
]
remediation = [
  "Investigate the listed account: confirm with the user and their manager that the invitations were for a known project or partner, and check who was invited.",
  "If they were not, remove the invited guests and secure the inviting account by resetting its password and revoking its sessions.",
  "Then contain: limit guest invitations to specific admin roles or the Guest Inviter role, and restrict invitations to allowed domains in the external collaboration settings.",
]
verify = "$since = (Get-Date).AddDays(-30).ToString('yyyy-MM-ddTHH:mm:ssZ'); Get-MgAuditLogDirectoryAudit -All -Filter \"activityDateTime ge $since and activityDisplayName eq 'Invite external user'\" | Group-Object { $_.InitiatedBy.User.UserPrincipalName }, { $_.ActivityDateTime.ToString('yyyy-MM-dd') } | Where-Object Count -ge 20 | Select-Object Name, Count"
cvss = "AV:N/AC:L/PR:L/UI:N/S:U/C:L/I:L/A:N"
mitre = ["T1136.003", "T1078.004"]

[[check.detail.references]]
title = "Configure external collaboration settings"
url = "https://learn.microsoft.com/entra/external-id/external-collaboration-settings-configure"

