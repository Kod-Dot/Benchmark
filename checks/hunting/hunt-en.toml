[[check]]
id = "HUNT-EN-020"
title = "Changes to sync settings or Entra Connect accounts"
status = "implemented"
severity = "high"

[check.detail]
description = "In the last 30 days of audit logs, directory synchronization settings changed: sync was turned on or off for the tenant, or sync features such as soft match or hard match takeover were changed."
impact = "A finding is something to investigate, not proof of compromise: installing or rebuilding Microsoft Entra Connect produces the same events. Turning on soft match or hard match takeover lets an on-premises object be matched to an existing cloud account, including a cloud-only admin, so whoever controls on-premises AD can take over that account."
attack = [
  "Gets a role that can change sync settings, such as Hybrid Identity Administrator or Global Administrator.",
  "Turns on hard match or soft match takeover for the tenant.",
  "Creates an on-premises object that matches a cloud admin, lets it sync and sets its password, taking over the cloud account.",
]
remediation = [
  "Investigate each change: confirm with the person who made it and the team that runs Microsoft Entra Connect that it was part of a planned change.",
  "If it was not, set the features back with Update-MgDirectoryOnPremiseSynchronization (keep soft match and hard match takeover blocked) and review recent changes to cloud admin accounts.",
  "Then contain: limit who holds Hybrid Identity Administrator and treat the sync server and its accounts as Tier 0.",
]
