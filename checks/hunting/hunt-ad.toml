[[check]]
id = "HUNT-AD-022"
title = "SPNs added to user accounts by non-admins (5136), with follow-up RC4 ticket requests"
status = "implemented"
severity = "high"

[check.detail]
description = "Reads directory attribute changes (event 5136, value added) to servicePrincipalName on objects of class user on every domain controller over the collector's event window (EventDays, 7 days by default). A change is listed unless it was made by SYSTEM, a default admin principal, a Tier 0 account or a domain controller. For each listed account, the hunt also checks the Kerberoasting events (4769 with RC4, see HUNT-AD-002) for an RC4 service ticket requested for that account, and says so. The events need Audit Directory Service Changes (success), and are written only where the object's SACL audits writes to this attribute; the follow-up needs Audit Kerberos Service Ticket Operations (success). Seeing nothing only means nothing was logged, not that no SPN was added."
impact = "A finding is something to investigate, not proof of compromise: application owners with delegated rights add SPNs for new services. An SPN added by someone with write access to a user, followed by an RC4 ticket request, is targeted Kerberoasting: the attacker gets a crackable ticket for an account that had no SPN before."
attack = [
  "Gets write access to an account's servicePrincipalName, for example through GenericWrite or GenericAll delegated by mistake.",
  "Adds a made-up SPN to the account and requests an RC4 service ticket for it (targeted Kerberoasting).",
  "Removes the SPN again and cracks the ticket offline to recover the account's password.",
]
remediation = [
  "Investigate each listed change: confirm with the account shown in the finding why it added the SPN, and whether the SPN is still there and used by a service.",
  "If it was not legitimate, remove the SPN, reset the target account's password to a long random value, and review sign-ins as that account since; pay most attention to entries where an RC4 ticket followed.",
  "Then contain: remove write access to servicePrincipalName on user accounts from accounts that do not need it, and set AES-only encryption on service accounts.",
]
