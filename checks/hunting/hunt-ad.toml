[[check]]
id = "HUNT-AD-020"
title = "Coercion attempts: EFS, print spooler or DFS RPC pipes opened on DCs (5145)"
status = "implemented"
severity = "high"

[check.detail]
description = "Reads detailed file share access checks (event 5145) on the IPC$ share for the named pipes efsrpc (EFS RPC, PetitPotam), spoolss (print spooler, PrinterBug) and netdfs (DFS RPC, DFSCoerce) on every domain controller over the collector's event window (EventDays, 7 days by default). Every source address is listed per pipe with the accounts it connected as; there is no threshold. Print clients use the spooler pipe legitimately when a DC shares printers, while the EFS pipe has no routine use on a DC. PetitPotam over the lsarpc pipe is not covered. Up to the newest 5,000 matching events are read per DC. The events need Audit Detailed File Share (success). Seeing nothing only means nothing was logged, not that no coercion was attempted."
impact = "A finding is something to investigate, not proof of compromise. A real coercion makes the DC authenticate to a machine the attacker controls, which relays it, for example to AD CS web enrollment to get a certificate for the DC, or captures it on a host with unconstrained delegation; either way the attacker can then act as the DC and replicate the directory."
attack = [
  "Signs in as any domain user, or uses an anonymous session where allowed.",
  "Calls an EFS, print spooler or DFS RPC method on the DC that makes it connect to a path on the attacker's machine (PetitPotam, SpoolSample, DFSCoerce).",
  "Relays the DC's authentication to AD CS or LDAP, or captures its ticket, and uses it to impersonate the DC.",
]
remediation = [
  "Investigate each listed source: identify the machine and whether it is a print client or management server with a reason to use these pipes on a DC.",
  "If not, isolate it and look for relayed authentication around the same time: certificates issued to DC accounts on the CAs, and logons of DC computer accounts from unusual addresses.",
  "Then contain: disable the Print Spooler service on DCs, block the EFS and DFS RPC interfaces with RPC filters where not needed, and require Extended Protection for Authentication on AD CS web enrollment.",
]
frameworks = [
  "NIST 800-53 AU-6",
  "NIST 800-53 SI-4",
  "NIST 800-53 CM-7",
]
verify = '''
foreach ($dc in (Get-ADDomainController -Filter *).HostName) {
  Get-WinEvent -ComputerName $dc -LogName Security -FilterXPath "*[System[EventID=5145 and TimeCreated[timediff(@SystemTime) <= 604800000]]] and *[EventData[Data[@Name='RelativeTargetName']='efsrpc' or Data[@Name='RelativeTargetName']='spoolss' or Data[@Name='RelativeTargetName']='netdfs']]" -ErrorAction SilentlyContinue |
    ForEach-Object { $d = @{}; ([xml]$_.ToXml()).Event.EventData.Data | ForEach-Object { $d[$_.Name] = $_.'#text' }; [pscustomobject]@{ DC = $dc; Time = $_.TimeCreated; Pipe = $d.RelativeTargetName; From = $d.IpAddress; Account = $d.SubjectUserName } }
}'''
