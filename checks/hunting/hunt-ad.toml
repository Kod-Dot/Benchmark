[[check]]
id = "HUNT-AD-013"
title = "Services installed outside standard folders and scheduled tasks created by people on DCs (7045/4698)"
status = "implemented"
severity = "medium"

[check.detail]
description = "Reads service installations (event 7045 from the Service Control Manager in the System log) and scheduled task creations (event 4698 in the Security log) on every domain controller over the collector's event window (EventDays, 7 days by default). A service is listed when its program is outside C:\\Windows, %SystemRoot%, System32, C:\\Program Files, C:\\Program Files (x86) and the Windows Defender folder under C:\\ProgramData, or when it matches a known attack tool (see HUNT-AD-024); only the program path is collected, never its arguments. A task is listed when it was created by an account that is not a computer account (a person or service account), or when a computer account created a task with an 8-letter random name in the root folder. Event 7045 is always written to the System log; event 4698 needs Audit Other Object Access Events (success). Seeing nothing only means nothing was logged, not that nothing was installed."
impact = "A finding is something to investigate, not proof of compromise: agents, backup and monitoring tools install services and admins create tasks. A malicious service or task on a DC runs as SYSTEM on the most sensitive server in the domain and is a common way to run tools and keep access."
attack = [
  "Gets admin rights on a domain controller.",
  "Installs a service or creates a scheduled task, remotely or locally, that runs its program from a writable folder such as C:\\Users or C:\\Temp.",
  "Runs credential theft or remote control tools as SYSTEM, and keeps the service or task as a way back in.",
]
remediation = [
  "Investigate each listed service and task: identify the program and who installed it, and confirm with the server or product owner that it is expected on a DC.",
  "If it is not, stop and disable it only after collecting the program file and the related logs, then treat the DC as compromised: look for the account that created it and what else it did.",
  "Then contain: keep DCs free of non-essential software, and alert on 7045 and 4698 on DCs.",
]
frameworks = [
  "NIST 800-53 AU-6",
  "NIST 800-53 CM-7",
  "NIST 800-53 SI-4",
]
verify = '''
foreach ($dc in (Get-ADDomainController -Filter *).HostName) {
  Get-WinEvent -ComputerName $dc -FilterHashtable @{ LogName = 'System'; ProviderName = 'Service Control Manager'; Id = 7045; StartTime = (Get-Date).AddDays(-7) } -ErrorAction SilentlyContinue |
    ForEach-Object { $d = @{}; ([xml]$_.ToXml()).Event.EventData.Data | ForEach-Object { $d[$_.Name] = $_.'#text' }; [pscustomobject]@{ DC = $dc; Time = $_.TimeCreated; Service = $d.ServiceName; Image = $d.ImagePath; Account = $d.AccountName } }
  Get-WinEvent -ComputerName $dc -FilterHashtable @{ LogName = 'Security'; Id = 4698; StartTime = (Get-Date).AddDays(-7) } -ErrorAction SilentlyContinue |
    ForEach-Object { $d = @{}; ([xml]$_.ToXml()).Event.EventData.Data | ForEach-Object { $d[$_.Name] = $_.'#text' }; [pscustomobject]@{ DC = $dc; Time = $_.TimeCreated; Task = $d.TaskName; By = $d.SubjectUserName } }
}'''
