url = "https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-5137"

[[check]]
id = "HUNT-AD-010"
title = "Permission changes on AdminSDHolder or the domain head (5136)"
status = "implemented"
severity = "high"

[check.detail]
description = "Reads directory attribute changes (event 5136, value added) to nTSecurityDescriptor on CN=AdminSDHolder or on the domain head (a DN made only of DC= parts) on every domain controller over the collector's event window (EventDays, 7 days by default). Every change is listed with the object, who made it and how often; changes by admins are not excluded, since these permissions rarely change. The events need Audit Directory Service Changes (success) and the default SACLs on AdminSDHolder and the domain head. Seeing nothing only means nothing was logged, not that the permissions did not change."
impact = "A finding is something to investigate, not proof of compromise: installing Exchange or other directory-aware products, or a planned delegation, changes these permissions. A malicious change on AdminSDHolder is copied to every protected admin account within an hour, and one on the domain head can grant replication rights (DCSync) or full control of the domain."
attack = [
  "Gets rights to write the permissions of AdminSDHolder or the domain head, for example as a Domain Admin or through a misconfigured delegation.",
  "Adds an entry giving an account it controls full control on AdminSDHolder, or replication rights on the domain head.",
  "Keeps control of every admin account, or dumps the directory with DCSync, even after its original access is removed.",
]
remediation = [
  "Investigate each change: confirm with the person who made it, shown in the finding, that it was a planned change, and compare the current permissions with a known-good baseline.",
  "If it was not planned, remove the added entries, check the accounts they named for use since the change, and look for DCSync (HUNT-AD-001) by those accounts.",
  "Then contain: limit who can write these permissions to the Tier 0 admins, and alert on every 5136 for nTSecurityDescriptor on these objects.",
]
frameworks = [
  "NIST 800-53 AU-6",
  "NIST 800-53 SI-4",
  "NIST 800-53 AC-6",
]
verify = '''
foreach ($dc in (Get-ADDomainController -Filter *).HostName) {
  Get-WinEvent -ComputerName $dc -LogName Security -FilterXPath "*[System[EventID=5136 and TimeCreated[timediff(@SystemTime) <= 604800000]]] and *[EventData[Data[@Name='AttributeLDAPDisplayName']='nTSecurityDescriptor']]" -ErrorAction SilentlyContinue |
