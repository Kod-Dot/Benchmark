[[check]]
id = "HUNT-AD-005"
title = "Brute force against single accounts and lockout storms (4625/4771/4740)"
status = "implemented"
severity = "medium"

[check.detail]
description = "Reads the same failed sign-ins as the password spray hunt (event 4625, and event 4771 with failure code 0x18) and the account lockouts (event 4740) on every domain controller over the collector's event window (EventDays, 7 days by default). An account is listed when it failed 25 or more sign-ins from one source address. When the domain logged 10 or more lockouts in the window, every locked-out account is also listed with the computer it was locked from; fewer lockouts are counted but not listed. The events need Audit Logon (failure), Audit Kerberos Authentication Service (failure) and Audit User Account Management (success). Seeing nothing only means nothing was logged, not that no guessing happened."
impact = "A finding is something to investigate, not proof of compromise: a phone or service still using an old password fails over and over and locks its account. Real guessing aims to recover one account's password, and a lockout storm can also be used to deny users access."
attack = [
  "Picks a target account, often a known admin or service account.",
  "Tries many passwords against it from one machine, or locks many accounts on purpose to disrupt the business.",
  "Signs in once a guess works, or uses the disruption to cover other activity.",
]
remediation = [
  "Investigate each listed account and source: identify the device behind the address or caller computer, and ask the user whether a device still holds an old password.",
  "If the source is not known, check for a successful sign-in after the failures; if one exists, reset the password and review what the account did.",
  "Then contain: fix or retire the device using old credentials, isolate an unknown source, and keep a lockout threshold with a reasonable reset time.",
]
frameworks = [
  "NIST 800-53 AU-6",
  "NIST 800-53 SI-4",
  "NIST 800-53 AC-7",
]
verify = '''
foreach ($dc in (Get-ADDomainController -Filter *).HostName) {
  Get-WinEvent -ComputerName $dc -FilterHashtable @{ LogName = 'Security'; Id = 4740; StartTime = (Get-Date).AddDays(-7) } -ErrorAction SilentlyContinue |
    ForEach-Object { $d = @{}; ([xml]$_.ToXml()).Event.EventData.Data | ForEach-Object { $d[$_.Name] = $_.'#text' }; [pscustomobject]@{ DC = $dc; Time = $_.TimeCreated; Account = $d.TargetUserName; CallerComputer = $d.TargetDomainName } }
}'''
cvss = "AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:L"
mitre = ["T1110"]

[[check.detail.references]]
title = "MITRE ATT&CK T1110: Brute Force"
url = "https://attack.mitre.org/techniques/T1110/"

