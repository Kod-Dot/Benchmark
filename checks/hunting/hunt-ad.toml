[[check]]
id = "HUNT-AD-006"
title = "Golden ticket indicators (TGS without prior TGT, abnormal ticket lifetimes)"
status = "implemented"
severity = "critical"

[check.detail]
description = "Service tickets were issued for accounts whose domain is written in lower case. Tickets the KDC issues carry the realm in upper case; tools that forge golden tickets often do not."
impact = "A golden ticket gives the attacker any identity in the domain for as long as the krbtgt key stays the same."
remediation = [
  "Investigate the accounts and source addresses.",
  "If forgery is confirmed, reset the krbtgt password twice and follow the incident response process.",
]
verify = "Get-WinEvent -FilterHashtable @{LogName='Security';Id=4769} | Where-Object { $_.Properties[1].Value -cmatch '[a-z]' }"
mitre = ["T1558.001"]

[[check]]
id = "HUNT-AD-007"
title = "Silver ticket / forged PAC indicators (KDC PAC validation events)"
status = "implemented"
severity = "high"

[check.detail]
description = "The KDC logged events 35 to 38: tickets with missing PAC fields (PAC_REQUESTOR or PAC_ATTRIBUTES)."
impact = "Tickets issued by current DCs carry these fields. Their absence points to forged (silver or golden) tickets or to very old tickets from before the 2021 updates."
remediation = [
  "Identify the accounts and clients named in the events.",
  "Once no legitimate client is affected, move PacRequestorEnforcement to enforcement.",
]
verify = "Get-WinEvent -FilterHashtable @{LogName='System';ProviderName='Microsoft-Windows-Kerberos-Key-Distribution-Center';Id=35,36,37,38}"
mitre = ["T1558"]

[[check]]
id = "HUNT-AD-008"
title = "NTLM network logons of privileged accounts on DCs (pass-the-hash indicator, 4624)"
status = "implemented"
severity = "high"

[check.detail]
description = "Reads successful network logons (event 4624, logon type 3) that used the NTLM package on every domain controller over the collector's event window (EventDays, 7 days by default); anonymous logons are left out. An account is listed when it is a privileged user (a recursive member of a Tier 0 admin group: Domain Admins, Enterprise Admins, Schema Admins, Administrators, the operator groups, DnsAdmins and similar) or a Tier 0 user account, with the workstations and addresses it signed in from. Logons of other accounts are only counted. Up to the newest 5,000 matching events are read per DC. The events need Audit Logon (success). Seeing nothing only means nothing was logged, not that no NTLM was used."
impact = "A finding is something to investigate, not proof of compromise: scripts, old tools and access by IP address instead of name fall back to NTLM. But NTLM is what pass-the-hash and NTLM relay use: an attacker who has an admin's NT hash, or relays its authentication, signs in to a domain controller without ever knowing the password."
attack = [
  "Steals an admin's NT hash from the memory of a machine the admin used, or coerces and relays the admin's authentication.",
  "Authenticates to a domain controller over SMB or RPC with the hash or the relayed session (Mimikatz sekurlsa::pth, Impacket psexec or wmiexec with -hashes).",
  "Runs commands on the DC or dumps the directory with the admin's rights.",
]
remediation = [
  "Investigate each listed account and source: confirm with the admin whether they worked from that machine at that time and which tool they used.",
  "If they did not, treat the account as compromised: reset its password (twice for accounts that may hold Kerberos keys in memory), check the source machine for credential theft tools, and review what the account did.",
  "Then contain: add admins to Protected Users, which blocks NTLM for them, make admins use Kerberos by name rather than IP address, and restrict NTLM on DCs where audit shows it is no longer needed.",
]
frameworks = [
  "NIST 800-53 AU-6",
  "NIST 800-53 SI-4",
  "NIST 800-53 AC-6",
]
verify = '''
$admins = (Get-ADGroupMember 'Domain Admins' -Recursive).SID.Value
foreach ($dc in (Get-ADDomainController -Filter *).HostName) {
  Get-WinEvent -ComputerName $dc -LogName Security -FilterXPath "*[System[EventID=4624 and TimeCreated[timediff(@SystemTime) <= 604800000]]] and *[EventData[Data[@Name='LogonType']='3' and Data[@Name='AuthenticationPackageName']='NTLM']]" -ErrorAction SilentlyContinue |
    ForEach-Object { $d = @{}; ([xml]$_.ToXml()).Event.EventData.Data | ForEach-Object { $d[$_.Name] = $_.'#text' }; if ($admins -contains $d.TargetUserSid) { [pscustomobject]@{ DC = $dc; Time = $_.TimeCreated; Account = $d.TargetUserName; Workstation = $d.WorkstationName; From = $d.IpAddress } } }
}'''
cvss = "AV:N/AC:H/PR:N/UI:N/S:C/C:H/I:H/A:H"
mitre = ["T1550", "T1078.002", "T1557.001"]

