  "If it was not legitimate, remove the added key credential, reset the target's password, and review sign-ins as the target since the change.",
  "Then contain: remove write access to msDS-KeyCredentialLink from accounts that do not need it, and alert on 5136 for this attribute by unexpected accounts.",
]
frameworks = [
  "NIST 800-53 AU-6",
  "NIST 800-53 SI-4",
  "NIST 800-53 IA-5",
]
verify = '''
foreach ($dc in (Get-ADDomainController -Filter *).HostName) {
