# HUNT-AD: On-prem hunt

area = "HUNT-AD"

[[check]]
id = "HUNT-AD-001"
title = "DCSync performed by a non-DC (event 4662 with replication GUIDs)"
status = "implemented"
severity = "critical"

[check.detail]
description = "Reads event 4662 (an operation was performed on an object) with access mask 0x100 (control access) whose properties name a directory replication right: DS-Replication-Get-Changes (1131f6aa-…), DS-Replication-Get-Changes-All (1131f6ad-…) or DS-Replication-Get-Changes-In-Filtered-Set (89e95b76-…), on every domain controller over the collector's event window (EventDays, 7 days by default). Requests by SYSTEM and by the domain controllers' own computer accounts are excluded, and Entra Connect connector accounts (names starting MSOL_, AAD_ or SYNC_) are shown separately as expected. Every other account is listed with its request count; a computer account from outside this domain is flagged to confirm it is a DC of another domain. The events need Audit Directory Service Access (success) and an auditing entry (SACL) for the replication rights on the domain head. Seeing nothing only means nothing was logged, not that no replication was requested."
impact = "A finding is something to investigate, not proof of compromise: a backup, identity or monitoring product with replication rights can produce the same events. A real DCSync means someone pulled password hashes from the directory, including the krbtgt key, which lets them sign in as any account and forge Kerberos tickets until those keys are changed."
attack = [
  "Gets an account that holds the replication rights, such as a Domain Admin or an account granted them through a delegation mistake.",
  "From any domain-joined or network-reachable machine, asks a domain controller to replicate account secrets over the directory replication protocol (DRSUAPI), as Mimikatz lsadump::dcsync or Impacket secretsdump do.",
  "Uses the NTLM hashes and Kerberos keys it received to sign in as any account, or forges golden tickets with the krbtgt key.",
]
remediation = [
  "Investigate each listed account: find out which machine it requested replication from (the 4624 logon on the same DC just before the 4662), and whether a product or person is known to use it for replication.",
  "If nobody can account for it, treat the domain as compromised: disable the account, isolate the source machine, and plan a reset of krbtgt (twice, with replication in between) and of every privileged password.",
  "Then contain: remove the replication rights from every account that is not a domain controller or the Entra Connect connector account.",
]
frameworks = [
  "NIST 800-53 AU-6",
  "NIST 800-53 SI-4",
  "NIST 800-53 IR-4",
]
verify = '''
foreach ($dc in (Get-ADDomainController -Filter *).HostName) {
  Get-WinEvent -ComputerName $dc -LogName Security -FilterXPath "*[System[EventID=4662 and TimeCreated[timediff(@SystemTime) <= 604800000]]] and *[EventData[Data[@Name='AccessMask']='0x100']]" -ErrorAction SilentlyContinue |
    Where-Object { $_.Message -match '1131f6aa-9c07-11d1-f79f-00c04fc2dcd2|1131f6ad-9c07-11d1-f79f-00c04fc2dcd2|89e95b76-444d-4c62-991a-0facbeda640c' } |
    ForEach-Object { $x = [xml]$_.ToXml(); [pscustomobject]@{ DC = $dc; Time = $_.TimeCreated; Account = ($x.Event.EventData.Data | Where-Object Name -eq 'SubjectUserName').'#text' } }
}'''
cvss = "AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:H"
mitre = ["T1003.006"]

[[check.detail.references]]
title = "MITRE ATT&CK T1003.006: OS Credential Dumping: DCSync"
url = "https://attack.mitre.org/techniques/T1003/006/"

[[check.detail.references]]
title = "4662(S, F): An operation was performed on an object"
url = "https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4662"

[[check]]
id = "HUNT-AD-002"
title = "Kerberoasting patterns (one account requesting RC4 service tickets for many services)"
status = "implemented"
severity = "high"

[check.detail]
description = "Reads successful service ticket requests (event 4769, status 0x0) with RC4 encryption (ticket encryption type 0x17) on every domain controller over the collector's event window (EventDays, 7 days by default). Tickets for computer accounts (service names ending in $) and for krbtgt are left out. An account is listed when it requested RC4 tickets for 5 or more distinct services in the window, with the services and source addresses. Up to the newest 5,000 matching events are read per DC. The events need Audit Kerberos Service Ticket Operations (success). Seeing nothing only means nothing was logged, not that no tickets were requested."
impact = "A finding is something to investigate, not proof of compromise: old clients or applications that only support RC4 can produce the same pattern. A real Kerberoast means someone holds tickets they can crack offline to recover the passwords of service accounts, which are often privileged and rarely changed."
attack = [
  "Signs in as any domain user and lists accounts with a service principal name (SPN).",
  "Requests a service ticket for each of them, asking for RC4 so the ticket is encrypted with the account's NT hash (Rubeus kerberoast, Impacket GetUserSPNs).",
  "Cracks the tickets offline and signs in as the service accounts whose passwords fall.",
]
remediation = [
  "Investigate each listed account: confirm with its user whether they ran a tool that lists services, and check the source addresses against known servers and admin workstations.",
  "If the requests were not legitimate, reset the passwords of the service accounts named in the finding to long random values (or move them to group managed service accounts), and look for sign-ins as those accounts since.",
  "Then contain: set msDS-SupportedEncryptionTypes to AES only on service accounts, and remove SPNs that are no longer used.",
]
frameworks = [
  "NIST 800-53 AU-6",
  "NIST 800-53 SI-4",
  "NIST 800-53 IA-5",
]
verify = '''
foreach ($dc in (Get-ADDomainController -Filter *).HostName) {
  Get-WinEvent -ComputerName $dc -LogName Security -FilterXPath "*[System[EventID=4769 and TimeCreated[timediff(@SystemTime) <= 604800000]]] and *[EventData[Data[@Name='TicketEncryptionType']='0x17' and Data[@Name='Status']='0x0']]" -ErrorAction SilentlyContinue |
    ForEach-Object { $d = @{}; ([xml]$_.ToXml()).Event.EventData.Data | ForEach-Object { $d[$_.Name] = $_.'#text' }; [pscustomobject]@{ Account = $d.TargetUserName; Service = $d.ServiceName } } |
    Where-Object { $_.Service -notmatch '\$$' -and $_.Service -ne 'krbtgt' } |
    Group-Object Account | Where-Object { ($_.Group.Service | Sort-Object -Unique).Count -ge 5 } | Select-Object Name, Count
}'''
cvss = "AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N"
mitre = ["T1558.003"]

[[check.detail.references]]
title = "MITRE ATT&CK T1558.003: Steal or Forge Kerberos Tickets: Kerberoasting"
url = "https://attack.mitre.org/techniques/T1558/003/"

[[check.detail.references]]
title = "4769(S, F): A Kerberos service ticket was requested"
url = "https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4769"

[[check]]
id = "HUNT-AD-003"
title = "AS-REP roasting: tickets issued without Kerberos pre-authentication (4768)"
status = "implemented"
severity = "high"

[check.detail]
description = "Reads successful ticket-granting ticket requests (event 4768, status 0x0) with pre-authentication type 0, meaning the domain controller issued a ticket without pre-authentication, on every domain controller over the collector's event window (EventDays, 7 days by default). There is no threshold and no exclusion: every account that received such a ticket is listed with its count and source addresses. The events need Audit Kerberos Authentication Service (success). Seeing nothing only means nothing was logged, not that no such tickets were issued."
impact = "A finding is something to investigate, not proof of compromise: an old system that needs 'Do not require Kerberos preauthentication' produces the same events. Otherwise someone asked for the account's ticket without knowing its password, and can crack the encrypted part offline to recover the password."
attack = [
  "Lists accounts with 'Do not require Kerberos preauthentication' set, which any domain user can read, or simply tries a list of user names.",
  "Requests a ticket for each of them without pre-authentication (Rubeus asreproast, Impacket GetNPUsers).",
  "Cracks the encrypted part of the reply offline and signs in with the recovered passwords.",
]
remediation = [
  "Investigate each listed account and source address: confirm whether a known system signs in as that account without pre-authentication.",
  "If not, reset the account's password to a long random value and look for sign-ins as that account since the ticket was issued.",
  "Then contain: clear 'Do not require Kerberos preauthentication' on every account that does not strictly need it.",
]
frameworks = [
  "NIST 800-53 AU-6",
  "NIST 800-53 SI-4",
  "NIST 800-53 IA-2",
]
verify = '''
foreach ($dc in (Get-ADDomainController -Filter *).HostName) {
  Get-WinEvent -ComputerName $dc -LogName Security -FilterXPath "*[System[EventID=4768 and TimeCreated[timediff(@SystemTime) <= 604800000]]] and *[EventData[Data[@Name='PreAuthType']='0' and Data[@Name='Status']='0x0']]" -ErrorAction SilentlyContinue |
    ForEach-Object { $d = @{}; ([xml]$_.ToXml()).Event.EventData.Data | ForEach-Object { $d[$_.Name] = $_.'#text' }; [pscustomobject]@{ DC = $dc; Time = $_.TimeCreated; Account = $d.TargetUserName; From = $d.IpAddress } }
}
Get-ADUser -Filter 'DoesNotRequirePreAuth -eq $true' | Select-Object SamAccountName'''
cvss = "AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
mitre = ["T1558.004"]

[[check.detail.references]]
title = "MITRE ATT&CK T1558.004: Steal or Forge Kerberos Tickets: AS-REP Roasting"
url = "https://attack.mitre.org/techniques/T1558/004/"

