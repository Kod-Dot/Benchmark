[[check]]
id = "HUNT-AD-011"
title = "New members added to Tier 0 groups (4728/4732/4756) in the window"
status = "implemented"
severity = "high"

[check.detail]
description = "Reads group membership additions to global (event 4728), domain local and built-in (event 4732) and universal (event 4756) security groups on every domain controller over the collector's event window (EventDays, 7 days by default). An addition is listed when the group is a Tier 0 group: Domain Admins, Domain Controllers, Schema Admins, Enterprise Admins, Key Admins, Enterprise Key Admins, Administrators, Account Operators, Server Operators, Print Operators, Backup Operators or DnsAdmins. Additions by admins are not excluded. Additions to other groups are only counted. The events need Audit Security Group Management (success). Seeing nothing only means nothing was logged, not that no one was added."
impact = "A finding is something to investigate, not proof of compromise: admins join and leave these groups through normal change processes. An unplanned addition gives the member control of the domain, and is a common last step of an attack and a common way to keep access."
attack = [
  "Gets rights to change the membership of a Tier 0 group, as an admin or through a delegation or ACL mistake.",
  "Adds an account it controls to Domain Admins, Administrators or an operator group.",
  "Uses the account's new rights to take over domain controllers, or keeps it as a backdoor.",
]
remediation = [
  "Investigate each addition: confirm it against an approved change, and check with the person who made it, shown in the finding.",
  "If it was not approved, remove the member, reset its password, and review what it did while it was a member; also check the account that made the change.",
  "Then contain: keep Tier 0 group membership minimal, and alert on every addition to these groups.",
]
frameworks = [
