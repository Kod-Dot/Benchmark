[check.detail]
description = "Reads directory attribute changes (event 5136, value added) to msDS-KeyCredentialLink on every domain controller over the collector's event window (EventDays, 7 days by default). A change is listed unless it was made by SYSTEM, a domain controller, an Entra Connect connector account (names starting MSOL_, AAD_ or SYNC_), or the account itself, as Windows Hello for Business and device registration do. The events need Audit Directory Service Changes (success), and are written only where the object's SACL audits writes to this attribute. Seeing nothing only means nothing was logged, not that no key credential was added."
impact = "A finding is something to investigate, not proof of compromise: some provisioning tools write key credentials for users. A key credential added by someone else lets them request a Kerberos ticket and the NT hash of the target account with a certificate they hold (PKINIT), without changing or knowing its password."
attack = [
