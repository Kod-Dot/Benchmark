[[check]]
id = "HUNT-AD-024"
title = "Known attack-tool artifacts on DCs (PsExec-style services, Mimikatz drivers, atexec tasks)"
status = "implemented"
severity = "critical"

[check.detail]
description = "Reads service installations (event 7045 from the Service Control Manager in the System log) and scheduled task creations (event 4698) on every domain controller over the collector's event window (EventDays, 7 days by default). A service is listed when its name or program contains a default name of a remote execution or credential theft tool: PSEXESVC (PsExec), PAExec, RemComSvc (RemCom), CSExecSvc (CSExec), winexesvc (winexe), mimidrv, mimikatz or mimilib (Mimikatz), BTOBTO (Impacket smbexec), gsecdump, WCEService (Windows Credential Editor), pwdump or fgexec (fgdump); or when its program is a command shell (%COMSPEC%, cmd.exe or PowerShell), as Impacket's and Metasploit's PsExec variants install it. A task is listed when its name is 8 random letters in the root folder, as Impacket atexec creates it. Only names and program paths are matched, never arguments, so a renamed tool is not found. Event 7045 is always written; event 4698 needs Audit Other Object Access Events (success). Seeing nothing only means nothing was logged, not that no tool ran."
impact = "A finding is something to investigate, not proof of compromise: admins use PsExec legitimately, and a tool may install a service that runs a shell. On a DC, though, these artifacts usually mean someone ran commands remotely as SYSTEM or loaded credential theft tools on the server that holds every password hash in the domain."
attack = [
  "Gets admin credentials or an NT hash that is valid on a domain controller.",
  "Runs commands on the DC remotely through a temporary service (PsExec, Impacket psexec or smbexec) or scheduled task (atexec).",
  "Dumps credentials from LSASS or the directory database, often loading Mimikatz or its driver to get past protections.",
]
remediation = [
  "Investigate each listed artifact: find the account and source machine that installed it (the 4624 logon just before it on the same DC), and confirm with that admin whether they used the tool.",
  "If nobody can account for it, treat the domain as compromised: isolate the source machine, collect the DC's logs and memory, and plan a reset of krbtgt (twice) and of every privileged password.",
  "Then contain: block remote service creation and admin logons to DCs from anything but Tier 0 admin workstations, and alert on 7045 and 4698 on DCs.",
]
frameworks = [
  "NIST 800-53 AU-6",
  "NIST 800-53 SI-4",
  "NIST 800-53 IR-4",
]
verify = '''
$tools = 'psexesvc|paexec|remcomsvc|csexecsvc|winexesvc|mimidrv|mimikatz|mimilib|btobto|gsecdump|wceservice|pwdump|fgexec|%comspec%|cmd\.exe|powershell'
foreach ($dc in (Get-ADDomainController -Filter *).HostName) {
  Get-WinEvent -ComputerName $dc -FilterHashtable @{ LogName = 'System'; ProviderName = 'Service Control Manager'; Id = 7045; StartTime = (Get-Date).AddDays(-7) } -ErrorAction SilentlyContinue |
    ForEach-Object { $d = @{}; ([xml]$_.ToXml()).Event.EventData.Data | ForEach-Object { $d[$_.Name] = $_.'#text' }; if ("$($d.ServiceName) $($d.ImagePath)" -match $tools) { [pscustomobject]@{ DC = $dc; Time = $_.TimeCreated; Service = $d.ServiceName; Image = $d.ImagePath } } }
  Get-WinEvent -ComputerName $dc -FilterHashtable @{ LogName = 'Security'; Id = 4698; StartTime = (Get-Date).AddDays(-7) } -ErrorAction SilentlyContinue |
    ForEach-Object { $d = @{}; ([xml]$_.ToXml()).Event.EventData.Data | ForEach-Object { $d[$_.Name] = $_.'#text' }; if ($d.TaskName -cmatch '^\\[A-Za-z]{8}$') { [pscustomobject]@{ DC = $dc; Time = $_.TimeCreated; Task = $d.TaskName; By = $d.SubjectUserName } } }
}'''
cvss = "AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:H"
mitre = ["T1569.002", "T1543.003", "T1053.005", "T1003"]

