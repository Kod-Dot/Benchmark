[[check]]
id = "HUNT-AD-009"
title = "DCShadow: domain controller (nTDSDSA) objects created for servers that are not DCs of this domain (5137)"
status = "implemented"
severity = "critical"

[check.detail]
description = "Reads directory object creations (event 5137) of class nTDSDSA, the NTDS Settings object that makes a server a replication partner, on every domain controller over the collector's event window (EventDays, 7 days by default). A creation is listed when the server object it sits under does not match the computer account of a domain controller of this domain. Creations for this domain's own DCs, such as a planned promotion, are only counted. A DC of another domain in the forest being promoted also appears, so check that first. The events need Audit Directory Service Changes (success), and are written only where the configuration partition's SACL audits object creation. Seeing nothing only means nothing was logged, not that no rogue DC was registered."
impact = "A finding is something to investigate, not proof of compromise. A real DCShadow means someone with Domain Admin or SYSTEM on a DC registered a machine as a temporary domain controller and pushed changes (SID history, group membership, ACLs) through replication, which bypasses the usual change auditing on the real DCs."
attack = [
  "Gets Domain Admin or equivalent rights.",
  "Registers an ordinary machine as a domain controller by creating its nTDSDSA object and the replication SPNs (Mimikatz lsadump::dcshadow).",
  "Pushes forged changes to the real DCs through replication, then removes the registration.",
]
remediation = [
  "Investigate each listed object: identify the server named in the DN, who created it (shown in the finding) and whether a DC promotion was planned at that time.",
  "If not, treat the domain as compromised: isolate the server, review replication metadata (repadmin /showobjmeta) of sensitive objects for changes that originated from it, and reverse them.",
  "Then contain: reset the credentials of the account that created the object and plan a krbtgt reset, since the attacker already held Tier 0 rights.",
]
frameworks = [
  "NIST 800-53 AU-6",
  "NIST 800-53 SI-4",
  "NIST 800-53 IR-4",
]
verify = '''
foreach ($dc in (Get-ADDomainController -Filter *).HostName) {
  Get-WinEvent -ComputerName $dc -LogName Security -FilterXPath "*[System[EventID=5137 and TimeCreated[timediff(@SystemTime) <= 604800000]]] and *[EventData[Data[@Name='ObjectClass']='nTDSDSA']]" -ErrorAction SilentlyContinue |
    ForEach-Object { $d = @{}; ([xml]$_.ToXml()).Event.EventData.Data | ForEach-Object { $d[$_.Name] = $_.'#text' }; [pscustomobject]@{ DC = $dc; Time = $_.TimeCreated; By = $d.SubjectUserName; Object = $d.ObjectDN } }
}
Get-ADObject -SearchBase "CN=Sites,$((Get-ADRootDSE).configurationNamingContext)" -LDAPFilter '(objectClass=nTDSDSA)' | Select-Object DistinguishedName'''
cvss = "AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:H"
mitre = ["T1207", "T1098"]

[[check.detail.references]]
title = "MITRE ATT&CK T1207: Rogue Domain Controller"
url = "https://attack.mitre.org/techniques/T1207/"

