[[check]]
id = "HUNT-AD-004"
title = "Password spraying (4625/4771 failures across many accounts from one source)"
status = "implemented"
severity = "high"

[check.detail]
description = "Reads failed sign-ins on every domain controller over the collector's event window (EventDays, 7 days by default): event 4625 (an account failed to log on) and event 4771 (Kerberos pre-authentication failed) with failure code 0x18, a wrong password; other 4771 codes are not password guesses and are left out. Failures are grouped by source address, and a source is listed when it failed to sign in as 10 or more different accounts. Failures without an address are grouped as an unknown source. Up to the newest 5,000 matching events are read per DC. The events need Audit Logon (failure) and Audit Kerberos Authentication Service (failure). Seeing nothing only means nothing was logged, not that no spray happened; NTLM credential checks (event 4776) are not read."
impact = "A finding is something to investigate, not proof of compromise: a terminal server, proxy or misconfigured service can fail for many users from one address. A real spray means someone is guessing common passwords across the domain, and any account with a weak password may already be in their hands."
attack = [
  "Collects user names from the directory, the web or earlier leaks.",
  "Tries one or two common passwords against every account from the same machine, staying under the lockout threshold.",
  "Signs in with the accounts where a guess worked.",
]
remediation = [
  "Investigate each listed source: identify the machine behind the address and whether it hosts many users, such as a terminal server or proxy.",
  "Look for successful sign-ins (4624, 4768) from the same address to the accounts it tried; for any you find, confirm with the user and reset the password if it was not them.",
  "Then contain: isolate the source machine if it is not legitimate, enforce a password policy or banned-password list that rejects common passwords, and keep a lockout threshold.",
]
frameworks = [
  "NIST 800-53 AU-6",
  "NIST 800-53 SI-4",
  "NIST 800-53 AC-7",
]
verify = '''
foreach ($dc in (Get-ADDomainController -Filter *).HostName) {
  Get-WinEvent -ComputerName $dc -LogName Security -FilterXPath "*[System[(EventID=4625 or EventID=4771) and TimeCreated[timediff(@SystemTime) <= 604800000]]]" -ErrorAction SilentlyContinue |
    ForEach-Object { $d = @{}; ([xml]$_.ToXml()).Event.EventData.Data | ForEach-Object { $d[$_.Name] = $_.'#text' }; if ($_.Id -eq 4625 -or $d.Status -eq '0x18') { [pscustomobject]@{ From = $d.IpAddress; Account = $d.TargetUserName } } } |
    Group-Object From | Where-Object { ($_.Group.Account | Sort-Object -Unique).Count -ge 10 } | Select-Object Name, Count
}'''
cvss = "AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:L/A:N"
mitre = ["T1110.003"]

[[check.detail.references]]
title = "MITRE ATT&CK T1110.003: Brute Force: Password Spraying"
url = "https://attack.mitre.org/techniques/T1110/003/"

