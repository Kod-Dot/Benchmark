    ForEach-Object { $d = @{}; ([xml]$_.ToXml()).Event.EventData.Data | ForEach-Object { $d[$_.Name] = $_.'#text' }; [pscustomobject]@{ DC = $dc; Time = $_.TimeCreated; Group = $d.TargetUserName; Member = $d.MemberName; By = $d.SubjectUserName } }
}'''
