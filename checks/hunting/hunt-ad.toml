[[check]]
id = "HUNT-AD-014"
title = "Security log cleared (1102) or audit policy changed directly, not by the DC itself (4719)"
status = "implemented"
severity = "high"

[check.detail]
description = "Reads Security log clears (event 1102) and system audit policy changes (event 4719) on every domain controller over the collector's event window (EventDays, 7 days by default). Every log clear is listed with the account that cleared it. An audit policy change is listed unless it was made by SYSTEM, a computer account or a domain controller of this domain, which is how Group Policy applies audit settings; what remains are direct changes, for example with auditpol. Event 1102 is always written; event 4719 needs Audit Audit Policy Change (success). Seeing nothing only means nothing was logged, not that the logs or the policy were not touched."
impact = "A finding is something to investigate, not proof of compromise: an admin may clear a full log or test an audit setting. On a DC, though, a cleared log or a switched-off audit category is a classic way to hide an attack, and removes the evidence every other hunt here relies on."
attack = [
  "Gets admin rights on a domain controller.",
  "Turns off the audit categories that would record its next steps (auditpol /set), or clears the Security log after acting (wevtutil cl Security, Clear-EventLog).",
  "Carries on with the attack, leaving little or no trace in the DC's logs.",
]
remediation = [
  "Investigate each event: confirm with the account shown in the finding why it cleared the log or changed the policy, and check other DCs and any central log store (SIEM) for events from the cleared period.",
  "If nobody can account for it, treat the DC as compromised and look for the activity that was hidden, using copies of the logs held elsewhere.",
  "Then contain: forward DC Security logs to a central store, set the audit policy through Group Policy with 'Force audit policy subcategory settings' enabled, and alert on 1102 and on 4719 not made by SYSTEM.",
]
frameworks = [
  "NIST 800-53 AU-6",
  "NIST 800-53 AU-9",
  "NIST 800-53 SI-4",
]
verify = '''
foreach ($dc in (Get-ADDomainController -Filter *).HostName) {
  Get-WinEvent -ComputerName $dc -FilterHashtable @{ LogName = 'Security'; Id = 1102, 4719; StartTime = (Get-Date).AddDays(-7) } -ErrorAction SilentlyContinue |
    Select-Object @{n='DC';e={$dc}}, TimeCreated, Id, @{n='By';e={ ([xml]$_.ToXml()).SelectSingleNode("//*[local-name()='SubjectUserName']").InnerText }}
}'''
cvss = "AV:N/AC:L/PR:H/UI:N/S:U/C:N/I:H/A:N"
mitre = ["T1070.001", "T1562.002"]

