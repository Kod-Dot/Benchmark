[[check]]
id = "HUNT-AD-015"
title = "SID history added or attempted (4765/4766)"
status = "implemented"
severity = "critical"

[check.detail]
description = "Reads SID history additions (event 4765) and failed attempts (event 4766) on every domain controller over the collector's event window (EventDays, 7 days by default). Every event is listed with the account, the SIDs added and who added them; there is no exclusion, since SID history should only change during a planned migration. The events need Audit User Account Management (success and failure). Seeing nothing only means nothing was logged, not that no SID history was added; SID history written through replication, as DCShadow does, or by editing the database offline, does not produce these events."
impact = "A finding is something to investigate, not proof of compromise: a domain migration with ADMT adds SID history legitimately. Outside a migration, an account that gains the SID of an admin group in its SID history gets that group's rights everywhere, without being a member of it."
attack = [
  "Gets Domain Admin rights or SYSTEM on a DC.",
  "Adds the SID of Domain Admins, Enterprise Admins or another privileged principal to the SID history of an ordinary account (Mimikatz sid::add).",
  "Signs in as the ordinary account, which now carries admin rights while appearing in no admin group.",
]
remediation = [
  "Investigate each event: confirm it against a planned migration, and check who added the SID history, shown in the finding.",
  "If it was not planned, clear the added SID history (with an approved change, as a Tier 0 admin), reset the account's password, and review what it did; treat the account that added it as compromised.",
  "Then contain: once migrations are finished, enable SID filtering on trusts and alert on 4765 and 4766.",
]
frameworks = [
  "NIST 800-53 AU-6",
  "NIST 800-53 AC-2",
  "NIST 800-53 SI-4",
]
verify = '''
foreach ($dc in (Get-ADDomainController -Filter *).HostName) {
  Get-WinEvent -ComputerName $dc -FilterHashtable @{ LogName = 'Security'; Id = 4765, 4766; StartTime = (Get-Date).AddDays(-7) } -ErrorAction SilentlyContinue |
    ForEach-Object { $d = @{}; ([xml]$_.ToXml()).Event.EventData.Data | ForEach-Object { $d[$_.Name] = $_.'#text' }; [pscustomobject]@{ DC = $dc; Time = $_.TimeCreated; Id = $_.Id; Account = $d.TargetUserName; Sids = $d.SidList; By = $d.SubjectUserName } }
}
Get-ADUser -LDAPFilter '(sIDHistory=*)' -Properties sIDHistory | Select-Object SamAccountName, sIDHistory'''
